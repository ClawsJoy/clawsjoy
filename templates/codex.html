<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawsJoy Codex - 智能体测试中心</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23818cf8'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z'/%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --success: #10b981;
            --error: #ef4444;
            --border: #334155;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        
        /* 主布局 */
        .app {
            display: flex;
            height: 100vh;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.2s;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sidebar-header p {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        
        /* 新建对话按钮 */
        .new-chat {
            margin: 16px;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .new-chat:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        /* 对话列表 */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .chat-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        
        .chat-item:hover {
            background: var(--bg-tertiary);
        }
        
        .chat-item.active {
            background: var(--accent);
        }
        
        .chat-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }
        
        .chat-item-delete {
            opacity: 0;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        
        .chat-item:hover .chat-item-delete {
            opacity: 0.7;
        }
        
        .chat-item-delete:hover {
            opacity: 1 !important;
            color: var(--error);
        }
        
        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        /* 顶部栏 */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
        }
        
        /* Agent 选择器 */
        .agent-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .agent-badge {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .agent-badge:hover {
            background: var(--bg-tertiary);
            transform: translateY(-1px);
        }
        
        .agent-badge.active {
            background: var(--accent);
            border-color: var(--accent-hover);
        }
        
        /* 状态指示器 */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 消息区域 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .message {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.assistant {
            align-items: flex-start;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .message.user .message-avatar {
            background: var(--accent);
        }
        
        .message.assistant .message-avatar {
            background: var(--bg-tertiary);
        }
        
        .message-content {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message.user .message-content {
            background: var(--accent);
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: var(--bg-secondary);
            border-bottom-left-radius: 4px;
        }
        
        /* 代码块样式 */
        .message-content pre {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
            font-family: 'Fira Code', 'Monaco', monospace;
        }
        
        .message-content code {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }
        
        /* 输入区域 */
        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-wrapper textarea {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: all 0.2s;
        }
        
        .input-wrapper textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        
        .input-wrapper button {
            padding: 12px 28px;
            background: var(--accent);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .input-wrapper button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        /* 快捷命令 */
        .quick-commands {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .quick-cmd {
            padding: 6px 14px;
            background: var(--bg-secondary);
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }
        
        .quick-cmd:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }
        
        /* 打字动画 */
        .typing-dots span {
            animation: blink 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes blink {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            .agent-badge {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>⚡ ClawsJoy Codex</h1>
            <p>智能体测试中心 · 多 Agent 协作</p>
        </div>
        <div class="new-chat" id="newChatBtn">
            <span>+</span> 新建对话
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main">
        <div class="header">
            <div class="agent-selector" id="agentSelector"></div>
            <div class="status">
                <span class="status-dot"></span>
                <span>在线</span>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="2" placeholder="输入消息... (Ctrl+Enter 发送)"></textarea>
                <button id="sendBtn">发送</button>
            </div>
            <div class="quick-commands" id="quickCommands"></div>
        </div>
    </div>
</div>

<script>
(function() {
    const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiZDE2YjIwYjJjZWRjZjNjZiIsInVzZXJuYW1lIjoidGVzdHVzZXIiLCJyb2xlIjoidXNlciIsImV4cCI6MTc4MTE4MzMyMn0.2cbQMYnwasdm1cxjxtUuhJyODjaF4GyXoHdma-TZnzQ";
    
    // Agent 配置
    const AGENTS = {
        chat_agent: { name: 'Chat', icon: '💬', description: '对话、记忆、情感' },
        code_agent: { name: 'Code', icon: '💻', description: '代码生成、调试' },
        analysis_agent: { name: 'Analysis', icon: '📊', description: '数据分析' },
        translate_agent: { name: 'Translate', icon: '🌐', description: '多语言翻译' },
        calculator_agent: { name: 'Calculator', icon: '🔢', description: '科学计算' },
        butler_agent: { name: 'Butler', icon: '👤', description: '私人管家' },
        orchestrator: { name: 'Orchestrator', icon: '🎯', description: '任务编排' },
        memory_agent: { name: 'Memory', icon: '🧠', description: '记忆管理' },
        dialect_agent: { name: 'Dialect', icon: '🗣️', description: '方言大师' }
    };
    
    // 快捷命令
    const QUICK_COMMANDS = {
        chat_agent: ['你好', '我叫小明', '我喜欢蓝色'],
        code_agent: ['写一个快速排序函数', '解释代码：def fib(n): return n if n<2 else fib(n-1)+fib(n-2)'],
        translate_agent: ['中译英：你好世界', '翻译成日语：谢谢'],
        calculator_agent: ['计算 123 + 456', 'sqrt(16) + 3^2'],
        butler_agent: ['添加待办 买牛奶', '查看待办'],
        orchestrator: ['分析数据然后生成报告'],
        memory_agent: ['记住 生日=5月1日', '回忆 生日'],
        dialect_agent: ['学习方言 阿拉 = 我们', '转换成宁波话 我们回家'],
        analysis_agent: ['分析销售数据']
    };
    
    let conversations = [];
    let currentId = null;
    let currentAgent = 'chat_agent';
    
    // DOM 元素
    const messagesDiv = document.getElementById('messages');
    const chatListDiv = document.getElementById('chatList');
    const agentSelectorDiv = document.getElementById('agentSelector');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    
    // 渲染 Agent 选择器
    function renderAgentSelector() {
        let html = '';
        for (const [key, agent] of Object.entries(AGENTS)) {
            const activeClass = key === currentAgent ? 'active' : '';
            html += `<div class="agent-badge ${activeClass}" data-agent="${key}">
                ${agent.icon} ${agent.name}
            </div>`;
        }
        agentSelectorDiv.innerHTML = html;
        
        document.querySelectorAll('.agent-badge').forEach(el => {
            el.addEventListener('click', () => switchAgent(el.dataset.agent));
        });
    }
    
    // 渲染快捷命令
    function renderQuickCommands() {
        const container = document.getElementById('quickCommands');
        const cmds = QUICK_COMMANDS[currentAgent] || QUICK_COMMANDS.chat_agent;
        container.innerHTML = cmds.map(cmd => 
            `<span class="quick-cmd" onclick="window.insertCmd('${cmd.replace(/'/g, "\\'")}')">${cmd.slice(0, 30)}${cmd.length > 30 ? '...' : ''}</span>`
        ).join('');
    }
    
    // 切换 Agent
    function switchAgent(agentName) {
        currentAgent = agentName;
        const conv = conversations.find(c => c.id === currentId);
        if (conv) conv.agent = agentName;
        renderAgentSelector();
        renderQuickCommands();
        save();
        renderMessages();
    }
    
    // 插入命令
    window.insertCmd = function(cmd) {
        messageInput.value = cmd;
        messageInput.focus();
    };
    
    // 保存数据
    function save() {
        localStorage.setItem('codex_conversations_v2', JSON.stringify(conversations));
    }
    
    // 加载数据
    function loadData() {
        const saved = localStorage.getItem('codex_conversations_v2');
        if (saved) {
            conversations = JSON.parse(saved);
        } else {
            const now = Date.now();
            conversations = [{ id: now, title: '新对话', messages: [], agent: 'chat_agent', createdAt: new Date().toISOString() }];
        }
        currentId = conversations[0].id;
        currentAgent = conversations[0].agent || 'chat_agent';
    }
    
    // 渲染对话列表
    function renderChatList() {
        let html = '';
        for (const conv of conversations) {
            const activeClass = conv.id === currentId ? 'active' : '';
            const title = conv.title || '新对话';
            html += `<div class="chat-item ${activeClass}" data-id="${conv.id}">
                <span class="chat-item-title">${escapeHtml(title)}</span>
                <span class="chat-item-delete" data-id="${conv.id}">🗑️</span>
            </div>`;
        }
        chatListDiv.innerHTML = html;
        
        document.querySelectorAll('.chat-item').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('chat-item-delete')) {
                    e.stopPropagation();
                    deleteChat(parseInt(el.dataset.id));
                } else {
                    switchChat(parseInt(el.dataset.id));
                }
            });
        });
    }
    
    // 删除对话
    function deleteChat(id) {
        if (conversations.length === 1) {
            newChat();
            return;
        }
        const index = conversations.findIndex(c => c.id === id);
        if (index !== -1) {
            conversations.splice(index, 1);
            if (currentId === id) {
                currentId = conversations[0].id;
                currentAgent = conversations[0].agent || 'chat_agent';
                renderAgentSelector();
                renderQuickCommands();
            }
            save();
            renderChatList();
            renderMessages();
        }
    }
    
    // 格式化消息内容
    function formatMessage(content) {
        if (!content) return '';
        let result = String(content);
        result = result.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
        result = result.replace(/\n/g, '<br>');
        return result;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // 添加消息
    function addMessage(role, content, agent = null) {
        const conv = conversations.find(c => c.id === currentId);
        if (!conv) return;
        
        const displayContent = role === 'assistant' ? formatMessage(content) : escapeHtml(content);
        conv.messages.push({
            role: role,
            content: displayContent,
            rawContent: content,
            agent: agent,
            timestamp: Date.now()
        });
        
        if (conv.messages.length === 1 && conv.title === '新对话') {
            conv.title = content.slice(0, 30);
        }
        
        save();
        renderChatList();
        renderMessages();
    }
    
    // 渲染消息
    function renderMessages() {
        const conv = conversations.find(c => c.id === currentId);
        if (!conv) return;
        
        if (conv.messages.length === 0) {
            const agentInfo = AGENTS[currentAgent] || AGENTS.chat_agent;
            messagesDiv.innerHTML = `<div class="message assistant">
                <div class="message-header"><div class="message-avatar">⚡</div><span>ClawsJoy Codex</span></div>
                <div class="message-content">
                    🤖 欢迎使用 ClawsJoy Codex<br><br>
                    当前 Agent: <strong>${agentInfo.icon} ${agentInfo.name}</strong><br>
                    能力: ${agentInfo.description}<br><br>
                    💡 点击快捷命令测试，或输入自定义消息
                </div>
            </div>`;
            return;
        }
        
        let html = '';
        for (const msg of conv.messages) {
            const agentInfo = AGENTS[msg.agent];
            const displayName = msg.role === 'user' ? 'You' : (agentInfo?.name || 'ClawsJoy');
            const avatar = msg.role === 'user' ? '👤' : (agentInfo?.icon || '⚡');
            
            html += `<div class="message ${msg.role}">
                <div class="message-header">
                    <div class="message-avatar">${avatar}</div>
                    <span>${displayName}</span>
                </div>
                <div class="message-content">${msg.content}</div>
            </div>`;
        }
        messagesDiv.innerHTML = html;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    // 切换对话
    function switchChat(id) {
        currentId = id;
        const conv = conversations.find(c => c.id === currentId);
        if (conv && conv.agent) {
            currentAgent = conv.agent;
            renderAgentSelector();
            renderQuickCommands();
        }
        renderChatList();
        renderMessages();
    }
    
    // 新建对话
    function newChat() {
        const newId = Date.now();
        conversations.unshift({
            id: newId,
            title: '新对话',
            messages: [],
            agent: currentAgent,
            createdAt: new Date().toISOString()
        });
        currentId = newId;
        save();
        renderChatList();
        renderMessages();
    }
    
    // 显示打字动画
    function showTyping() {
        const typingDiv = document.getElementById('typingIndicator');
        if (typingDiv) typingDiv.remove();
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'message assistant';
        div.innerHTML = `<div class="message-header"><div class="message-avatar">⚡</div><span>${AGENTS[currentAgent]?.name || 'ClawsJoy'}</span></div>
            <div class="message-content"><span class="typing-dots"><span>●</span><span>●</span><span>●</span></span></div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function hideTyping() {
        const typingDiv = document.getElementById('typingIndicator');
        if (typingDiv) typingDiv.remove();
    }
    
    // 发送消息
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;
        
        addMessage('user', message);
        messageInput.value = '';
        showTyping();
        
        try {
            const response = await fetch('/api/v5/wisdom/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`
                },
                body: JSON.stringify({
                    user_id: 'codex_user',
                    agent: currentAgent,
                    message: message
                })
            });
            
            const data = await response.json();
            hideTyping();
            
            if (data.success) {
                let reply = data.response || data.output_content || '处理完成';
                if (Array.isArray(reply)) reply = reply[0] || '完成';
                addMessage('assistant', String(reply), currentAgent);
            } else {
                addMessage('assistant', '❌ ' + (data.error || data.response || '未知错误'), currentAgent);
            }
        } catch (error) {
            hideTyping();
            addMessage('assistant', '❌ 请求失败: ' + error.message, currentAgent);
        }
    }
    
    // 事件绑定
    sendBtn.addEventListener('click', sendMessage);
    newChatBtn.addEventListener('click', newChat);
    messageInput.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // 初始化
    loadData();
    renderAgentSelector();
    renderQuickCommands();
    renderChatList();
    renderMessages();
})();
</script>
</body>
</html>
