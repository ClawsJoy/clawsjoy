<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🐾 私人管家 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a1a; }
        .status { 
            position: absolute; bottom: 15px; left: 15px; 
            color: #00f3ff; font-size: 12px; 
            background: rgba(0,0,0,0.5); padding: 4px 12px; 
            border-radius: 20px; pointer-events: none; z-index: 10; 
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            color: #fff; font-size: 24px; cursor: pointer; z-index: 10;
            background: rgba(0,0,0,0.5); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .close-btn:hover { background: rgba(255,0,0,0.4); }
    </style>
</head>
<body>
    <div class="status">🐾 私人管家 ● 在线</div>
    <div class="close-btn" onclick="window.parent.postMessage({type:'close_butler'}, '*')">✕</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.target.set(0, 0.8, 0);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const backLight = new THREE.DirectionalLight(0x4466ff, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);

        // 角色组
        const group = new THREE.Group();

        // 身体
        const bodyGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.85, 32);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, metalness: 0.6, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = -0.2;
        body.castShadow = true;
        group.add(body);

        // 头部
        const headGeo = new THREE.SphereGeometry(0.48, 64, 64);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.4 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 0.38;
        group.add(head);

        // 眼睛
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 32, 32), eyeMat);
        leftEye.position.set(-0.18, 0.52, 0.48);
        group.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 32, 32), eyeMat);
        rightEye.position.set(0.18, 0.52, 0.48);
        group.add(rightEye);

        // 瞳孔
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 32, 32), pupilMat);
        leftPupil.position.set(-0.18, 0.5, 0.58);
        group.add(leftPupil);
        const rightPupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 32, 32), pupilMat);
        rightPupil.position.set(0.18, 0.5, 0.58);
        group.add(rightPupil);

        // 光环
        const haloGeo = new THREE.TorusGeometry(0.55, 0.06, 32, 100);
        const haloMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.5 });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.position.y = 0.85;
        halo.rotation.x = Math.PI / 2;
        group.add(halo);

        scene.add(group);

        // 地面网格
        const gridHelper = new THREE.GridHelper(5, 20, 0x4466ff, 0x2244aa);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // 动画
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;
            
            // 浮动动画
            group.position.y = Math.sin(time * 0.8) * 0.05;
            halo.rotation.z = Math.sin(time * 0.5) * 0.1;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
