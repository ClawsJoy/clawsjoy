<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawsJoy 智能体AI系统</title>
    <style>
        /* ========== 科幻极简未来风 核心变量 ========== */
        :root {
            --space-bg: #0a0a1a;
            --space-dark: #050510;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-pink: #ff00b3;
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --border-cyber: 1px solid rgba(0, 243, 255, 0.3);
            --glow-cyan: 0 0 10px rgba(0, 243, 255, 0.5);
            --glow-purple: 0 0 10px rgba(176, 0, 255, 0.5);
            --glass-bg: rgba(10, 10, 30, 0.85);
            --glass-blur: blur(12px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Fira Code', 'SF Mono', monospace;
            background: var(--space-bg);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* 网格背景 */
        .app {
            position: relative;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* 左侧边栏 */
        .sidebar {
            position: fixed;
            left: 15px;
            top: 15px;
            bottom: 15px;
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--border-cyber);
            border-radius: 12px;
            padding: 20px 15px;
            overflow-y: auto;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .logo {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: var(--border-cyber);
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .version {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* 用户信息区 */
        .user-section {
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 8px;
            border: var(--border-cyber);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .user-name {
            font-size: 14px;
            font-weight: bold;
        }

        .user-role {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        /* 角色标签 */
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-top: 8px;
        }
        .role-guest { background: rgba(100,100,100,0.3); color: #aaa; }
        .role-investor { background: rgba(255,193,7,0.2); color: #ffc107; border: 1px solid #ffc107; }
        .role-user { background: rgba(0,243,255,0.2); color: #00f3ff; border: 1px solid #00f3ff; }
        .role-developer { background: rgba(176,0,255,0.2); color: #b000ff; border: 1px solid #b000ff; }
        .role-enterprise { background: rgba(255,0,179,0.2); color: #ff00b3; border: 1px solid #ff00b3; }

        /* 菜单项 */
        .menu-category {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 10px 5px 10px;
        }

        .menu-item {
            padding: 10px 12px;
            margin: 4px 0;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.2s ease;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            color: var(--neon-cyan);
            border-left-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            transform: translateX(4px);
        }

        .menu-item.active {
            color: var(--neon-cyan);
            border-left-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
        }

        .menu-icon { font-size: 18px; }
        .menu-text { font-size: 13px; }

        /* 主内容区 */
        .main-content {
            margin-left: 310px;
            height: 100vh;
            overflow-y: auto;
            padding: 15px;
        }

        /* 登录/登出按钮 */
        .auth-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-small {
            padding: 4px 12px;
            font-size: 11px;
        }

        /* 通用组件 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--border-cyber);
            border-radius: 10px;
            padding: 20px;
        }

        .chat-container { height: calc(100vh - 30px); display: flex; flex-direction: column; }
        .chat-header { padding: 15px 20px; background: rgba(10,10,30,0.6); border: var(--border-cyber); border-radius: 10px; margin-bottom: 15px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: rgba(10,10,30,0.4); border: var(--border-cyber); border-radius: 10px; margin-bottom: 15px; }
        .message { margin-bottom: 12px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message-content { max-width: 70%; padding: 8px 14px; border-radius: 8px; background: rgba(0,243,255,0.08); border: var(--border-cyber); }
        .message.user .message-content { background: rgba(176,0,255,0.08); border-color: rgba(176,0,255,0.3); }
        .chat-input-area { display: flex; gap: 10px; padding: 12px 15px; background: rgba(10,10,30,0.6); border: var(--border-cyber); border-radius: 10px; }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: var(--border-cyber); color: var(--text-primary); padding: 10px 12px; border-radius: 6px; }
        .chat-input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); }
        .btn-cyber { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 20px; cursor: pointer; transition: all 0.2s; border-radius: 6px; }
        .btn-cyber:hover { background: rgba(0,243,255,0.2); box-shadow: var(--glow-cyan); }
        .status { position: fixed; bottom: 10px; right: 15px; font-size: 10px; padding: 4px 10px; background: var(--glass-bg); border-radius: 20px; z-index: 20; }
        .status.online { color: #4ade80; }
        .status.offline { color: #ef4444; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--space-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-card { background: rgba(0,243,255,0.05); border: var(--border-cyber); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-number { font-size: 24px; color: var(--neon-cyan); font-weight: bold; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="logo">
            <h1>✨ ClawsJoy</h1>
            <div class="version">v4.0.0 · 智能体AI系统</div>
        </div>

        <!-- 用户信息区 -->
        <div class="user-section" id="userSection">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-name" id="userName">游客模式</div>
            <div class="user-role" id="userRoleDisplay">guest</div>
            <div class="role-badge" id="roleBadge">🎫 游客</div>
            <div class="auth-buttons" id="authButtons">
                <button class="btn-cyber btn-small" onclick="showLoginModal()">登录</button>
                <button class="btn-cyber btn-small" onclick="showRegisterModal()">注册</button>
            </div>
        </div>

        <!-- 动态菜单 -->
        <div id="menuContainer"></div>
    </div>

    <div class="main-content">
        <div id="content"></div>
    </div>

    <div class="status offline" id="status">🔌 连接中...</div>
</div>

<!-- 登录弹窗 -->
<div id="loginModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div class="glass-card" style="width:350px;">
        <h3 style="margin-bottom:20px;">🔐 登录 ClawsJoy</h3>
        <input type="text" id="loginUsername" placeholder="用户名" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(255,255,255,0.1); border:var(--border-cyber); color:white;">
        <input type="password" id="loginPassword" placeholder="密码" style="width:100%; padding:10px; margin-bottom:20px; background:rgba(255,255,255,0.1); border:var(--border-cyber); color:white;">
        <button class="btn-cyber" style="width:100%;" onclick="doLogin()">登录</button>
        <button class="btn-cyber" style="width:100%; margin-top:10px;" onclick="closeLoginModal()">取消</button>
    </div>
</div>

<script>
    // ========== 角色菜单配置 ==========
    const roleMenus = {
        // 游客 - 仅品牌形象和商务展示
        guest: {
            name: '游客',
            badge: '🎫 游客',
            menus: [
                { category: '🏢 企业展示', items: [
                    { id: 'brand', name: '🌟 品牌形象', icon: '🌟', component: 'brand' },
                    { id: 'business', name: '💼 商务展示', icon: '💼', component: 'business' }
                ]}
            ]
        },
        // 投资人 - 可看商业数据
        investor: {
            name: '投资人',
            badge: '💰 投资人',
            menus: [
                { category: '🏢 企业展示', items: [
                    { id: 'brand', name: '🌟 品牌形象', icon: '🌟', component: 'brand' },
                    { id: 'business', name: '💼 商务展示(含数据)', icon: '💼', component: 'business_investor' }
                ]},
                { category: '📊 商业分析', items: [
                    { id: 'investor_data', name: '📈 投资数据', icon: '📈', component: 'investor_data' }
                ]}
            ]
        },
        // 注册用户 - 完整功能
        user: {
            name: '会员',
            badge: '🎖️ 会员',
            menus: [
                { category: '🏢 发现', items: [
                    { id: 'brand', name: '🌟 品牌形象', icon: '🌟', component: 'brand' },
                    { id: 'business', name: '💼 商务展示', icon: '💼', component: 'business' }
                ]},
                { category: '🤖 智能服务', items: [
                    { id: 'butler', name: '💬 私人管家', icon: '💬', component: 'butler' },
                    { id: 'tools', name: '🔧 AI工具集', icon: '🔧', component: 'tools' }
                ]},
                { category: '👤 个人', items: [
                    { id: 'profile', name: '👤 个人中心', icon: '👤', component: 'profile' },
                    { id: 'community', name: '🏪 生态社区', icon: '🏪', component: 'community' },
                    { id: 'monitor', name: '📊 监控中心', icon: '📊', component: 'monitor' },
                    { id: 'settings', name: '⚙️ 设置', icon: '⚙️', component: 'settings' }
                ]}
            ]
        },
        // 开发者 - 包含开发工作区
        developer: {
            name: '开发者',
            badge: '🛠️ 开发者',
            menus: [
                { category: '🏢 发现', items: [
                    { id: 'brand', name: '🌟 品牌形象', icon: '🌟', component: 'brand' },
                    { id: 'business', name: '💼 商务展示', icon: '💼', component: 'business' }
                ]},
                { category: '🤖 智能服务', items: [
                    { id: 'butler', name: '💬 私人管家', icon: '💬', component: 'butler' },
                    { id: 'tools', name: '🔧 AI工具集', icon: '🔧', component: 'tools' }
                ]},
                { category: '🛠️ 开发工作区', items: [
                    { id: 'developer', name: '💻 开发者工作区', icon: '💻', component: 'developer' },
                    { id: 'skill_publish', name: '📤 技能上架', icon: '📤', component: 'skill_publish' }
                ]},
                { category: '👤 个人', items: [
                    { id: 'profile', name: '👤 个人中心', icon: '👤', component: 'profile' },
                    { id: 'community', name: '🏪 生态社区', icon: '🏪', component: 'community' },
                    { id: 'monitor', name: '📊 监控中心', icon: '📊', component: 'monitor' }
                ]}
            ]
        },
        // 企业用户 - 含数字员工
        enterprise: {
            name: '企业版',
            badge: '🏢 企业版',
            menus: [
                { category: '🏢 企业服务', items: [
                    { id: 'brand', name: '🌟 品牌形象', icon: '🌟', component: 'brand' },
                    { id: 'business', name: '💼 企业方案', icon: '💼', component: 'business_enterprise' }
                ]},
                { category: '🤖 智能服务', items: [
                    { id: 'butler', name: '💬 私人管家', icon: '💬', component: 'butler' },
                    { id: 'tools', name: '🔧 AI工具集', icon: '🔧', component: 'tools' }
                ]},
                { category: '👔 数字员工', items: [
                    { id: 'digital_employee', name: '🤖 数字员工', icon: '🤖', component: 'digital_employee' },
                    { id: 'agent_training', name: '🎯 智能体训练', icon: '🎯', component: 'agent_training' }
                ]},
                { category: '👤 企业账户', items: [
                    { id: 'profile', name: '👤 企业中心', icon: '👤', component: 'profile' },
                    { id: 'monitor', name: '📊 监控中心', icon: '📊', component: 'monitor' }
                ]}
            ]
        }
    };

    // 页面组件内容
    const components = {
        brand: `<div class="glass-card"><h2>🌟 品牌形象</h2><p>ClawsJoy 智能体AI系统 · 引领未来智能交互</p><div class="stats-grid"><div class="stat-card"><div class="stat-number">116+</div><div>技能</div></div><div class="stat-card"><div class="stat-number">10+</div><div>Agent</div></div></div></div>`,
        business: `<div class="glass-card"><h2>💼 商务展示</h2><p>产品介绍与商务合作</p><div class="stats-grid"><div class="stat-card"><div class="stat-number">企业级</div><div>解决方案</div></div></div></div>`,
        business_investor: `<div class="glass-card"><h2>💼 商务数据</h2><div class="stats-grid"><div class="stat-card"><div class="stat-number">+300%</div><div>年度增长</div></div><div class="stat-card"><div class="stat-number">50+</div><div>企业客户</div></div></div></div>`,
        business_enterprise: `<div class="glass-card"><h2>🏢 企业方案</h2><p>定制化智能体解决方案</p><div class="stats-grid"><div class="stat-card"><div class="stat-number">7x24</div><div>服务</div></div><div class="stat-card"><div class="stat-number">99.9%</div><div>SLA</div></div></div></div>`,
        investor_data: `<div class="glass-card"><h2>📈 投资数据</h2><div class="stats-grid"><div class="stat-card"><div class="stat-number">¥XXX</div><div>估值</div></div><div class="stat-card"><div class="stat-number">XX%</div><div>ROI</div></div></div></div>`,
        butler: `<div class="chat-container"><div class="chat-header"><h2>💬 私人管家</h2></div><div class="chat-messages" id="chatMessages"><div class="message bot"><div class="message-content">你好！我是你的私人管家，有什么可以帮你的？</div></div></div><div class="chat-input-area"><input type="text" class="chat-input" id="chatInput" placeholder="输入消息..." onkeypress="if(event.keyCode===13)sendMessage()"><button class="btn-cyber" onclick="sendMessage()">发送</button></div></div>`,
        tools: `<div class="glass-card"><h2>🔧 AI工具集</h2><p>116个智能技能可用</p><div class="stats-grid"><div class="stat-card"><div class="stat-number">116</div><div>技能</div></div></div></div>`,
        profile: `<div class="glass-card"><h2>👤 个人中心</h2><p>用户信息管理</p></div>`,
        community: `<div class="glass-card"><h2>🏪 生态社区</h2><p>技能商店与社区交流</p></div>`,
        developer: `<div class="glass-card"><h2>💻 开发者工作区</h2><p>技能开发 · 调试 · 上架</p><div class="stats-grid"><div class="stat-card"><div class="stat-number">API</div><div>文档</div></div></div></div>`,
        skill_publish: `<div class="glass-card"><h2>📤 技能上架</h2><p>提交你的技能到商店</p></div>`,
        monitor: `<div class="glass-card"><h2>📊 监控中心</h2><p>系统运行状态</p><div class="stat-card" id="apiMonitor">检测中...</div></div>`,
        settings: `<div class="glass-card"><h2>⚙️ 设置</h2><p>系统偏好设置</p></div>`,
        digital_employee: `<div class="glass-card"><h2>🤖 数字员工</h2><p>智能员工管理与部署</p></div>`,
        agent_training: `<div class="glass-card"><h2>🎯 智能体训练</h2><p>自定义智能体训练平台</p></div>`
    };

    let currentUser = { role: 'guest', name: null, id: null, loggedIn: false };
    let currentPage = 'brand';
    let sessionId = 'web_' + Date.now();

    function renderMenu() {
        const roleConfig = roleMenus[currentUser.role] || roleMenus.guest;
        let html = '';
        for (const category of roleConfig.menus) {
            html += `<div class="menu-category">${category.category}</div>`;
            for (const item of category.items) {
                html += `<div class="menu-item ${currentPage === item.id ? 'active' : ''}" onclick="navigateTo('${item.id}', '${item.component}')">
                    <span class="menu-icon">${item.icon}</span>
                    <span class="menu-text">${item.name}</span>
                </div>`;
            }
        }
        document.getElementById('menuContainer').innerHTML = html;
        
        // 更新用户信息显示
        const roleConfigDisplay = roleMenus[currentUser.role] || roleMenus.guest;
        document.getElementById('userName').innerHTML = currentUser.name || roleConfigDisplay.name;
        document.getElementById('userRoleDisplay').innerHTML = currentUser.role;
        document.getElementById('roleBadge').innerHTML = roleConfigDisplay.badge;
        document.getElementById('roleBadge').className = `role-badge role-${currentUser.role}`;
        
        const authDiv = document.getElementById('authButtons');
        if (currentUser.loggedIn) {
            authDiv.innerHTML = `<button class="btn-cyber btn-small" onclick="logout()">登出</button>`;
        } else {
            authDiv.innerHTML = `<button class="btn-cyber btn-small" onclick="showLoginModal()">登录</button>
                                 <button class="btn-cyber btn-small" onclick="showRegisterModal()">注册</button>`;
        }
    }

    function navigateTo(pageId, componentId) {
        currentPage = pageId;
        const content = components[componentId] || components.brand;
        document.getElementById('content').innerHTML = content;
        renderMenu();
        
        if (componentId === 'butler') {
            setTimeout(() => {
                const input = document.getElementById('chatInput');
                if (input) input.focus();
            }, 100);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.innerHTML += `<div class="message user"><div class="message-content">${escapeHtml(text)}</div></div>`;
        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, user_role: currentUser.role, session_id: sessionId })
            });
            const data = await response.json();
            const reply = data.response || data.message || '收到消息';
            messagesDiv.innerHTML += `<div class="message bot"><div class="message-content">${escapeHtml(reply)}</div></div>`;
        } catch (error) {
            messagesDiv.innerHTML += `<div class="message bot"><div class="message-content">❌ 错误: ${error.message}</div></div>`;
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function checkStatus() {
        try {
            const resp = await fetch('/api/health');
            const data = await resp.json();
            const status = document.getElementById('status');
            if (data.status === 'ok') {
                status.innerHTML = `✅ 已连接 v${data.version || '3.0'}`;
                status.className = 'status online';
                return true;
            }
        } catch (e) {
            document.getElementById('status').innerHTML = '❌ 连接失败';
            document.getElementById('status').className = 'status offline';
        }
        return false;
    }

    function showLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function showRegisterModal() { alert('注册功能开发中，请联系管理员'); }

    async function doLogin() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        
        // 演示账户（实际应调用后端API）
        if (username === 'demo' && password === 'demo') {
            currentUser = { role: 'user', name: '演示用户', id: '1', loggedIn: true };
            closeLoginModal();
            renderMenu();
            navigateTo('butler', 'butler');
            alert('登录成功！当前角色：会员');
        } else if (username === 'dev' && password === 'dev') {
            currentUser = { role: 'developer', name: '开发者', id: '2', loggedIn: true };
            closeLoginModal();
            renderMenu();
            navigateTo('developer', 'developer');
            alert('登录成功！当前角色：开发者');
        } else if (username === 'investor' && password === 'investor') {
            currentUser = { role: 'investor', name: '投资人', id: '3', loggedIn: true };
            closeLoginModal();
            renderMenu();
            navigateTo('investor_data', 'investor_data');
            alert('登录成功！当前角色：投资人');
        } else if (username === 'enterprise' && password === 'enterprise') {
            currentUser = { role: 'enterprise', name: '企业用户', id: '4', loggedIn: true };
            closeLoginModal();
            renderMenu();
            navigateTo('digital_employee', 'digital_employee');
            alert('登录成功！当前角色：企业用户');
        } else {
            alert('登录失败，演示账户: demo/demo, dev/dev, investor/investor, enterprise/enterprise');
        }
    }

    function logout() {
        currentUser = { role: 'guest', name: null, id: null, loggedIn: false };
        renderMenu();
        navigateTo('brand', 'brand');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    renderMenu();
    navigateTo('brand', 'brand');
    checkStatus();
    setInterval(checkStatus, 10000);
</script>
</body>
</html>
