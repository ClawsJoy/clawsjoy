<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff 查看器</title>
    <style>
        body { background: #1e1e2e; color: #cdd6f4; font-family: monospace; padding: 20px; margin: 0; }
        .diff-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .diff-panel { flex: 1; background: #181825; border-radius: 8px; padding: 16px; }
        .diff-panel h3 { color: #89b4fa; margin-bottom: 12px; }
        .diff-line { padding: 2px 8px; border-radius: 4px; font-size: 13px; line-height: 1.6; }
        .diff-line.removed { background: #f38ba830; border-left: 3px solid #f38ba8; }
        .diff-line.added { background: #a6e3a130; border-left: 3px solid #a6e3a1; }
        .diff-line.unchanged { color: #6c7086; }
        .actions { text-align: center; margin-top: 20px; display: flex; gap: 16px; justify-content: center; }
        .actions button {
            padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        .actions .apply { background: #a6e3a1; color: #1e1e2e; }
        .actions .apply:hover { background: #b4befe; }
        .actions .cancel { background: #f38ba8; color: #1e1e2e; }
        .actions .cancel:hover { background: #f28b82; }
        .stats { padding: 8px 16px; background: #313244; border-radius: 4px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="stats" id="stats">加载中...</div>
    <div class="diff-container">
        <div class="diff-panel">
            <h3>📄 原代码</h3>
            <div id="original-code"></div>
        </div>
        <div class="diff-panel">
            <h3>📝 修复后</h3>
            <div id="fixed-code"></div>
        </div>
    </div>
    <div class="actions">
        <button class="apply" onclick="applyFix()">✅ 应用修复</button>
        <button class="cancel" onclick="closeDiff()">❌ 取消</button>
    </div>
    <script>
        let originalCode = '';
        let fixedCode = '';
        
        function renderDiff(original, fixed) {
            originalCode = original;
            fixedCode = fixed;
            
            const origLines = original.split('\n');
            const fixLines = fixed.split('\n');
            const origDiv = document.getElementById('original-code');
            const fixDiv = document.getElementById('fixed-code');
            
            // 简单逐行对比
            const maxLen = Math.max(origLines.length, fixLines.length);
            let added = 0, removed = 0;
            
            let origHtml = '';
            let fixHtml = '';
            for (let i = 0; i < maxLen; i++) {
                const origLine = i < origLines.length ? origLines[i] : '';
                const fixLine = i < fixLines.length ? fixLines[i] : '';
                
                if (origLine !== fixLine) {
                    if (origLine && fixLine) {
                        origHtml += `<div class="diff-line removed">${escapeHtml(origLine)}</div>`;
                        fixHtml += `<div class="diff-line added">${escapeHtml(fixLine)}</div>`;
                        removed++;
                        added++;
                    } else if (origLine) {
                        origHtml += `<div class="diff-line removed">${escapeHtml(origLine)}</div>`;
                        fixHtml += `<div class="diff-line removed" style="opacity:0.3;">(删除)</div>`;
                        removed++;
                    } else if (fixLine) {
                        origHtml += `<div class="diff-line added" style="opacity:0.3;">(新增)</div>`;
                        fixHtml += `<div class="diff-line added">${escapeHtml(fixLine)}</div>`;
                        added++;
                    }
                } else {
                    origHtml += `<div class="diff-line unchanged">${escapeHtml(origLine)}</div>`;
                    fixHtml += `<div class="diff-line unchanged">${escapeHtml(fixLine)}</div>`;
                }
            }
            
            origDiv.innerHTML = origHtml;
            fixDiv.innerHTML = fixHtml;
            
            document.getElementById('stats').innerHTML = 
                `📊 变化: ${added} 行新增, ${removed} 行删除 | 共 ${origLines.length} → ${fixLines.length} 行`;
        }
        
        function escapeHtml(text) {
            if (!text) return '&nbsp;';
            return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }
        
        function applyFix() {
            window.parent.postMessage({ type: 'apply_fix', fixed: fixedCode }, '*');
        }
        
        function closeDiff() {
            window.parent.postMessage({ type: 'close_diff' }, '*');
        }
        
        // 监听来自父窗口的消息
        window.addEventListener('message', function(event) {
            if (event.data.type === 'show_diff') {
                renderDiff(event.data.original, event.data.fixed);
            }
        });
        
        // 初始加载完成后通知父窗口
        window.parent.postMessage({ type: 'diff_ready' }, '*');
    </script>
</body>
</html>
