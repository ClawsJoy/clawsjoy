# Orchestrator 任务编排配置
version: "1.0.0"

# 任务类型映射
task_mappings:
  - patterns: ["分析", "统计", "计算", "报表"]
    agent: "analysis_agent"
  - patterns: ["代码", "编程", "写", "python"]
    agent: "code_agent"
  - patterns: ["视频", "制作", "剪辑"]
    agent: "video_agent"
  - patterns: ["翻译", "语言"]
    agent: "translate_agent"

# 默认配置
default_agent: "chat_agent"
max_subtasks: 5
parallel: false
