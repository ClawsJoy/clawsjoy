name: audio_agent
description: 音频处理专家，处理音频转换、语音识别和合成
capabilities:
  - name: transcribe
    description: 语音转文字（Whisper API）
  - name: text_to_speech
    description: 文字转语音（TTS）
  - name: convert_format
    description: 转换音频格式（mp3, wav, m4a, flac）
  - name: analyze_audio
    description: 分析音频内容
examples:
  - input: "转换音频格式 meeting_audio.mp3"
    output: "✅ 音频格式已转换"
  - input: "转文字 meeting_audio.mp3"
    output: "会议记录文字内容..."
