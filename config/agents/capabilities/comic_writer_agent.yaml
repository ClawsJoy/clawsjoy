name: comic_writer_agent
description: 漫剧剧本创作专家，将小说转换为专业漫剧剧本
version: 1.0.0

capabilities:
  - name: novel_to_script
    description: 将小说转换为漫剧剧本格式
    input_schema:
      type: object
      properties:
        novel_content:
          type: string
          description: 小说全文
        genre:
          type: string
          description: 类型（科幻/悬疑/热血/治愈/奇幻/日常）
        episodes:
          type: integer
          description: 集数（默认3集）
        style:
          type: string
          description: 视觉风格（温暖/冷峻/明亮/暗黑）
    output_schema:
      type: object
      properties:
        script:
          type: string
          description: 漫剧剧本（含分镜、对话、旁白）
        characters:
          type: array
          description: 角色档案列表
        scenes:
          type: array
          description: 场景列表

  - name: write_script
    description: 直接创作漫剧剧本
    input_schema:
      type: object
      properties:
        premise:
          type: string
          description: 故事前提/创意
        genre:
          type: string
          description: 类型
        episodes:
          type: integer
          description: 集数
    output_schema:
      type: object
      properties:
        script:
          type: string
          description: 完整漫剧剧本

  - name: revise_script
    description: 修改/优化已有剧本
    input_schema:
      type: object
      properties:
        script:
          type: string
          description: 原剧本
        feedback:
          type: string
          description: 修改意见
    output_schema:
      type: object
      properties:
        revised_script:
          type: string
          description: 修改后的剧本

examples:
  - input: 
      novel_content: "小明是个普通程序员..."
      genre: "科幻"
      episodes: 3
    output: 
      script: "### 第1集：觉醒\n\n【分镜1】..."
      characters: "[{name: '小明', age: 25, ...}]"
      scenes: "[{name: '办公室', ...}]"

tags:
  - comic
  - script
  - novel-to-script
  - storyboard
