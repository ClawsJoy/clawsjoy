# Code Agent 专用配置
name: code_agent
version: "1.0.0"

llm:
  provider: "ollama"
  model: "deepseek-coder:6.7b"
  temperature: 0.2
  max_tokens: 2048
  timeout: 60

capabilities:
  - "write_code"
  - "debug_code"
  - "explain_code"
  - "refactor_code"

languages:
  - "python"
  - "javascript"
  - "go"
  - "rust"

prompts:
  system: "你是一个专业的代码助手，擅长生成高质量、可运行的代码。"
