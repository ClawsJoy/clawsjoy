# Chat Agent 话本配置 - 全年龄段通用
version: "1.0.0"

intents:
  - keywords: ["你好", "您好", "hi", "hello", "在吗", "嗨"]
    response: "greeting"
  
  - keywords: ["功能", "能做什么", "介绍", "是什么", "特点", "能干吗", "产品介绍"]
    response: "features"
  
  - keywords: ["注册", "订阅", "怎么用", "如何开始", "成为会员", "加入", "开始使用"]
    response: "register_guide"
  
  - keywords: ["价格", "收费", "免费", "多少钱", "付费", "套餐"]
    response: "pricing"
  
  - keywords: ["商业", "企业", "团队", "合作", "B端"]
    response: "business"
  
  - keywords: ["技术", "API", "开发", "集成", "接口"]
    response: "developer"
  
  - keywords: ["好玩", "游戏", "有趣"]
    response: "fun"
  
  - keywords: ["你是谁", "谁", "小管", "什么助手", "你叫什么"]
    response: "about"

templates:
  greeting: |
    您好！👋 我是小管，ClawsJoy 智能助手。
    
    很高兴为您服务！有什么可以帮您的吗？
  
  features: |
    ClawsJoy 是新一代 AI 智能体操作系统，核心能力包括：
    
    🤖 私人管家 · 语音交互
    🎨 工作流编辑器 · 拖拽编排
    ⚡ 原子技能库 · 130+ 开箱即用
    💻 代码审核 · AI 辅助审查
    🛒 技能商店 · 开发者生态
    
    无论您是个人用户还是企业团队，都能找到合适的解决方案。
  
  register_guide: |
    注册流程非常简单：
    
    1️⃣ 点击右上角「商店」
    2️⃣ 选择「注册/登录」
    3️⃣ 填写用户名和密码
    4️⃣ 选择身份：普通用户 / 开发者
    
    注册后即可体验完整功能！🎉
  
  pricing: |
    💰 ClawsJoy 提供灵活的付费方案：
    
    • 普通用户：免费（基础功能）
    • 开发者：按技能使用量计费
    • 企业版：定制化解决方案
    
    注册后查看详情，或联系客服咨询。
  
  business: |
    🏢 企业版 ClawsJoy 专为团队打造：
    
    • 多租户隔离
    • 私有化部署
    • 定制技能开发
    • 专属技术支持
    
    欢迎联系我们获取定制方案！
  
  developer: |
    🔧 开发者可以：
    
    • 创建和发布自定义技能
    • 接入 API 进行二次开发
    • 在技能商店上架赚钱
    • 参与社区生态建设
    
    注册开发者账号，立即开启！
  
  fun: |
    ClawsJoy 不仅专业，也很有趣！🎉
    
    您可以用工作流编辑器"搭积木"编程，训练自己的智能助手，还可以探索各种创意技能。
    
    注册后就能解锁这些好玩的功能啦！
  
  about: |
    我是小管，ClawsJoy 系统的智能引导员。
    
    我帮您了解产品功能、引导注册、解答疑问。
    
    有什么可以帮您的？😊

default: |
    收到：{user_input}
    
    我是 ClawsJoy 智能助手，可以帮您：
    • 了解产品功能
    • 引导注册流程
    • 解答常见问题
    
    请问您想了解什么？
