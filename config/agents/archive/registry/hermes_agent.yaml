# Hermes Agent 注册配置
# 符合 ClawsJoy Agent 注册规范

name: hermes_agent
display_name: Hermes智能体
version: 1.0.0
type: core
description: 任务分解、工具调用、自我反思、技能创造的智能体
enabled: true
created_at: '2026-05-27'

implementation:
  module: core.agents.hermes_agent
  class: HermesAgent

capabilities:
  - task_decomposition    # 任务分解
  - tool_use             # 工具调用
  - self_reflection      # 自我反思
  - skill_creation       # 技能创造

permissions:
  - read_memory
  - write_memory
  - execute_skill
  - create_skill

config:
  max_iterations: 3
  similarity_threshold: 0.6
  enable_creation: true
