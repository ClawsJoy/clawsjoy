# 文案专家 Agent 注册配置
# 开发者只需创建此文件，系统自动加载

name: copywriter_agent
display_name: "文案专家"
version: "1.0.0"
type: "core"
enabled: true

implementation:
  module: "core.agents.copywriter_agent"
  class: "CopywriterAgent"

capabilities:
  - name: "slogan_generation"
    description: "生成广告语"
  - name: "product_description"
    description: "产品描述"
  - name: "social_media_copy"
    description: "社交媒体文案"

config:
  default_tone: "neutral"
  templates_version: "1.0"
