  video: ["裁剪", "转码", "截图", "合成", "视频", "剪辑"]
  code: ["代码", "函数", "编程", "实现", "algorithm"]
  translate: ["翻译", "译成", "translate"]
  calculate: ["计算", "加", "减", "乘", "除"]
