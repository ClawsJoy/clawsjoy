# 大脑调度器规则配置

executors:
  math_executor:
    enabled: true
    module: core.executors.math_executor
    class: MathExecutor
    description: 数学计算执行器

  workflow_executor:
    enabled: true
    module: core.lib.workflow_executor
    class: WorkflowExecutor
    description: 工作流执行器

  translate_executor:
    enabled: true
    module: skills.translate.translate_skill
    class: TranslateSkill
    description: 翻译执行器

  llm_executor:
    enabled: true
    module: core.executors.llm_executor
    class: LLMExecutor
    description: LLM 通用执行器

  video-download:
    enabled: true
    module: skills.video-download.scripts.main
    class: VideoDownload
    description: YouTube 视频下载

  version:
    enabled: true
    module: skills.version.scripts.main
    class: VersionSkill
    description: 获取系统版本信息

priority:
  - name: video-download
    keywords: ["下载视频", "保存视频", "youtube下载", "下载YouTube"]
    pattern: "https?://(?:youtu\\.be/|youtube\\.com/watch\\?v=)"
    handler: video-download
    description: YouTube视频下载

  - name: version
    keywords: ["版本", "version", "系统版本"]
    handler: version
    description: 查看版本

  - name: math
    keywords: ["计算", "加法", "减法", "乘法", "除法", "加", "减", "乘", "除"]
    handler: math_executor
    description: 数学计算

  - name: translate
    keywords: ["翻译", "translate", "译成", "翻成"]
    handler: translate_executor
    description: 文本翻译

  - name: workflow
    keywords: ["工作流", "流程", "编排"]
    handler: workflow_executor
    description: 工作流执行

  - name: llm
    default: true
    handler: llm_executor
    description: LLM 兜底
