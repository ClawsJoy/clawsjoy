# LLM 多模型配置
default_provider: ollama

providers:
  ollama:
    endpoint: http://127.0.0.1:11434
    model: qwen2.5:7b
    models:
      - qwen2.5:7b
      - qwen2.5:7b
      - qwen2.5:3b
      - deepseek-coder:6.7b
      - llama3.2:3b
      - nomic-embed-text

  openai:
    model: gpt-3.5-turbo
    api_key: "your-api-key"

# 路由策略
routing:
  code: deepseek-coder:6.7b
  math: qwen2.5:7b
  creative: qwen2.5:7b
  simple: qwen2.5:3b
  english: llama3.2:3b
  embedding: nomic-embed-text
  fallback: qwen2.5:7b
# 超时配置
timeout: 60
