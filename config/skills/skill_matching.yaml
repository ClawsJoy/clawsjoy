# 技能匹配配置 v5.0 - 关键词优先版
version: "5.0.0"

matching:
  weights:
    exact_name_match: 10.0
    keyword_match: 5.0
    semantic_match: 1.0

  keyword_mapping:
    # 编程相关
    编程: ["code_agent"]
    代码: ["code_agent"]
    Python: ["code_agent"]
    Java: ["code_agent"]
    JavaScript: ["code_agent"]
    写代码: ["code_agent"]
    开发: ["code_agent"]
    
    # 人工智能
    人工智能: ["ai_agent"]
    AI: ["ai_agent"]
    机器学习: ["ai_agent"]
    深度学习: ["ai_agent"]
    大模型: ["ai_agent"]
    LLM: ["ai_agent"]
    
    # Docker/容器
    Docker: ["docker_executor"]
    容器: ["docker_executor"]
    镜像: ["docker_executor"]
    部署: ["docker_executor"]
    
    # 计算/数学
    计算: ["calculate"]
    数学: ["calculate"]
    加法: ["calculate"]
    减法: ["calculate"]
    乘法: ["calculate"]
    除法: ["calculate"]
    算术: ["calculate"]
    
    # 翻译
    翻译: ["translate"]
    译: ["translate"]
    中译英: ["translate"]
    英译中: ["translate"]
    
    # 图片/视觉
    图片: ["vision"]
    图像: ["vision"]
    识别: ["vision"]
    看图: ["vision"]
    图片识别: ["vision"]
    图像分析: ["vision"]
    
    # 视频
    视频: ["auto_视频制作"]
    制作视频: ["auto_视频制作"]
    剪辑: ["auto_视频制作"]
    视频编辑: ["auto_视频制作"]
    
    # 学习
    学习: ["learn_chinese", "learn_english"]
    中文: ["learn_chinese"]
    英语: ["learn_english"]
    汉语: ["learn_chinese"]
    英文: ["learn_english"]
    
    # 天气
    天气: ["get_weather"]
    温度: ["get_weather"]
    预报: ["get_weather"]
    
    # 文件
    文件: ["read_file", "write_file", "list_files"]
    读取: ["read_file"]
    写入: ["write_file"]
    保存: ["write_file"]
    列出: ["list_files"]
    
    # 搜索
    搜索: ["search_book"]
    查找: ["search_book"]
    检索: ["search_book"]
    
    # 管家
    管家: ["personal_butler_v2"]
    改名: ["personal_butler_v2"]
    待办: ["personal_butler_v2"]
    提醒: ["personal_butler_v2"]
    
    # 知识
    知识: ["knowledge_search"]
    知识库: ["knowledge_search"]

priority_skills:
  - code_agent
  - ai_agent
  - docker_executor
  - calculate
  - translate
  - vision
  - auto_视频制作
  - learn_chinese
  - learn_english
  - get_weather
  - read_file
  - write_file
  - search_book
  - personal_butler_v2
  - knowledge_search

blacklist_skills:
  - feeding
  - spelling
  - unit
  - backup
  - light
  - attraction
  - onboarding
  - heart_rate
