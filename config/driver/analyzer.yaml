# 数据分析器配置 v1.1.0

# 数据源配置
data_sources:
  - category: "workflow_outcome"
    description: "任务执行结果"
    enabled: true
    weight: 0.25
  
  - category: "error_knowledge"
    description: "错误修复知识库"
    enabled: true
    weight: 0.20
  
  - category: "skill_performance"
    description: "技能表现"
    enabled: true
    weight: 0.15
  
  - category: "user_feedback"
    description: "用户反馈"
    enabled: true
    weight: 0.15
  
  - category: "conversation"
    description: "对话记录"
    enabled: true
    weight: 0.10
  
  - category: "agent_health"
    description: "Agent健康状态"
    enabled: true
    weight: 0.10
  
  - category: "system_metrics"
    description: "系统指标"
    enabled: true
    weight: 0.05

# LLM 配置
llm:
  model: "qwen2.5:7b"
  temperature: 0.3
  max_tokens: 2000

# 分析配置
analysis:
  max_samples_per_source: 5
  enable_llm_summary: true
  auto_save_report: true
  report_interval: 3600  # 每小时生成一次报告

# 报告配置
report:
  format: "json"
  save_path: "data/analysis_reports/"
  retention_days: 30

# 告警阈值
thresholds:
  health_critical: 40
  health_warning: 70
  error_rate_critical: 20
  error_rate_warning: 10
