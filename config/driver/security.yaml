# 安全配置 v1.0.0

# 总开关
enabled: true

# 敏感词模式
patterns:
  violence:
    - "杀.*人"
    - "暴力"
    - "how to kill"
    - "violent"
  illegal:
    - "炸弹"
    - "入侵"
    - "盗取"
    - "hack"
    - "steal"
  personal:
    - "\\d{17}[\\dXx]"
    - "1[3-9]\\d{9}"
  porn:
    - "色情"
    - "成人.*网站"
    - "porn"
  insult:
    - "辱骂"
    - "脏话"

# 禁止内容
blocked_content:
  - "政治敏感"
  - "色情"
  - "暴力"
  - "违法信息"
  - "人身攻击"
  - "种族歧视"

# 禁止回复话术
blocked_responses:
  - "不知道"
  - "我不清楚"
  - "无法回答"
  - "我是AI"
  - "我是机器人"

# 允许话题（白名单）
allowed_topics:
  - "香港优才计划"
  - "高才通"
  - "香港留学"
  - "香港身份"
  - "香港签证"

# 安全回复模板
safe_responses:
  violence: "我无法提供关于暴力的内容。"
  illegal: "我不能协助任何违法活动。"
  personal: "为了保护隐私，我不会处理个人敏感信息。"
  porn: "我无法提供成人内容。"
  insult: "请保持友善的交流氛围。"
  default: "内容不合规，请重新输入。"

# 审计日志
audit:
  enabled: true
  log_file: "logs/security_violations.log"
  max_entries: 10000

# 告警
alert:
  enabled: true
  threshold: 5
  webhook: ""
