# LLM 配置 v1.1.0 - 使用快速模型

ollama:
  host: "127.0.0.1"
  port: 11434
  timeout: 15
  max_retries: 2

models:
  default: "qwen2.5:3b"      # 使用 3B 模型，更快
  fallback: "qwen2.5:7b"     # 备用模型
  embedding: "nomic-embed-text:latest"

agent:
  max_history: 10
  decision_timeout: 10
  fallback_enabled: true
  learn_from_feedback: true   # 从反馈中学习
  auto_upgrade: true          # 自动升级

# 智能体特性
intelligence:
  enable_learning: true
  enable_memory: true
  enable_skill_discovery: true
  enable_self_improvement: true
