# 向量化优化配置
vector:
  embedding_model: nomic-embed-text
  collection_name: memory_vectors
  chunk_size: 512
  top_k: 10
  similarity_threshold: 0.6
  
  # 检索优化
  retrieval:
    default_top_k: 10
    similarity_threshold: 0.5
    rerank_enabled: true
    hybrid_search: true  # 混合检索：向量 + 关键词
  
  # 索引优化
  indexing:
    batch_size: 100
    update_on_change: true
  
  # 多租户
  tenant:
    isolation: true
    shared_collections: ["skills", "knowledge"]
