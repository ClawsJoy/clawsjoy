version: 4.0.0
services:
  gateway:
    host: 0.0.0.0
    port: 5002
    debug: false
  file_service:
    host: 0.0.0.0
    port: 5003
  multi_agent:
    host: 0.0.0.0
    port: 5005
  agent_api:
    host: 0.0.0.0
    port: 5010
llm:
  provider: ollama
  endpoint: http://127.0.0.1:11434
  default_model: qwen2.5:7b
  fast_model: qwen2.5:3b
  timeout: 30
  max_tokens: 512
  temperature: 0.7
paths:
  data_root: data
  logs_root: logs
  memory_root: memory
  skills_root: skills
  config_root: config
vector:
  embedding_model: nomic-embed-text
  collection_name: memory_vectors
  chunk_size: 1024
  top_k: 10
cache:
  enabled: true
  ttl: 3600
  max_size: 1000
hooks:
  enabled: true
  auto_load: true
rate_limit:
  enabled: true
  default_limit: 10
  time_window: 1
logging:
  level: INFO
  format: json
  max_size_mb: 100
  backup_count: 5
timeouts:
  default: 30
  long: 120
  short: 10
  download: 60
  upload: 300
  llm_generate: 60
  llm_stream: 120
  health_check: 5
  heartbeat: 30
retry:
  max_attempts: 3
  backoff: 2
  max_backoff: 30
security:
  encryption_algorithm: AES-256-GCM
  key_derivation: PBKDF2
  salt_length: 32
  key_length: 32
client:
  electron:
    window_width: 1400
    window_height: 900
    backgroundColor: '#0a0a1a'
  plugin:
    version: 1.0.0
    server_url: http://localhost:5002
environment: production

# 私人管家配置
butler:
  memory:
    history_limit: 50
    todo_auto_remind: true
    greet_daily: true
  paths:
    user_data: "data/users/{user_id}/butler_v2"
    memory_file: "memory.json"
    patterns_file: "patterns.json"
    vectors_dir: "vectors"
  features:
    vector_memory:
      enabled: true
      category: "conversation"
      top_k: 5
      similarity_threshold: 0.5
      auto_store: true
    evolution:
      enabled: true
      track_renames: true

butler:
  paths:
    user_data: "data/users/{user_id}/butler_v2"
    vectors_dir: "vectors"
  features:
    vector_memory:
      enabled: true
      top_k: 5
      similarity_threshold: 0.5
  memory:
    history_limit: 50

# 分析师配置 - 数据源定义
analyst:
  data_sources:
    internal_skills:
      path: "skills/"
      type: "directory"
      enabled: true
      description: "内部技能库"
    customer_skills:
      path: "skills/customer/"
      type: "directory"
      enabled: true
      description: "客户经营技能"
    club_stats:
      path: "data/butler_club/stats.json"
      type: "json"
      enabled: true
      description: "俱乐部统计"
    club_members:
      path: "data/butler_club/members/"
      type: "directory"
      enabled: true
      description: "俱乐部会员"
    frontend_metrics:
      path: "data/frontend_metrics/"
      type: "directory"
      enabled: true
      description: "前端性能指标"
    frontend_errors:
      path: "data/frontend_errors.json"
      type: "json"
      enabled: true
      description: "前端错误"
    user_behavior:
      path: "data/user_behavior/"
      type: "directory"
      enabled: true
      description: "用户行为"
    skill_stats:
      path: "data/skill_stats.json"
      type: "json"
      enabled: true
      description: "技能统计"
    agent_registry:
      path: "data/agent_registry.json"
      type: "json"
      enabled: true
      description: "Agent注册"
    memory_metadata:
      path: "data/memory_metadata.json"
      type: "json"
      enabled: true
      description: "记忆元数据"
    bypass_monitor:
      path: "data/bypass_monitor/"
      type: "directory"
      enabled: true
      description: "旁路监控"
    error_log:
      path: "logs/error.log"
      type: "log"
      enabled: true
      description: "错误日志"

# ========== 智能闭环配置 ==========
closed_loop:
  enabled: true
  version: "2.0.0"
  
  # 反馈触发阈值
  feedback:
    success_rate_warning: 0.7      # 成功率低于70%触发警告
    success_rate_critical: 0.5     # 成功率低于50%触发紧急
    satisfaction_warning: 60       # 满意度低于60触发警告
    satisfaction_critical: 40      # 满意度低于40触发紧急
    failure_trend_threshold: 10    # 7天失败次数超过10触发
  
  # 复杂度评估
  complexity:
    high_threshold: 60             # 高复杂度阈值
    medium_threshold: 30           # 中复杂度阈值
    multi_agent_bonus: 30          # 多Agent协作加分
    keyword_bonus: 20              # 关键词匹配加分
  
  # 会议配置
  meeting:
    auto_trigger: true             # 自动触发会议
    default_agents:
      - "analyst"
      - "decision" 
      - "orchestrator"
      - "self_healer"
    high_urgency_agents:
      - "analyst"
      - "decision"
      - "orchestrator"
      - "self_healer"
      - "security_agent"
  
  # 数据源
  data_sources:
    - "workflow_outcome"
    - "error_knowledge"
    - "skill_performance"
    - "user_feedback"
    - "conversation"
    - "agent_health"
    - "system_metrics"

# 知识中心配置
knowledge:
  enabled: true
  embedding_model: nomic-embed-text
  collection_name: knowledge_base
  chunk_size: 512
  top_k: 5

# 技能推荐配置
skill_recommend:
  enabled: true
  top_k: 5
  min_similarity: 0.3
  auto_index: true

# Agent 配置
agent:
  memory_enabled: true
  memory_limit: 100
  vector_enabled: true

# ========== 学习系统配置（配置驱动） ==========
learning:
  enabled: true
  auto_learn: true
  min_confidence: 0.6
  
  # 代理模式：使用哪个 Agent 进行学习
  agent:
    name: "chat_agent"
    use_butler: false  # 是否使用私人管家代理
  
  # 学习参数
  parameters:
    max_history: 50
    session_ttl: 3600
    context_enabled: false  # 是否传递 context 参数
  
  # 多租户
  multi_tenant:
    enabled: true
    isolation: true
    shared_patterns: true
