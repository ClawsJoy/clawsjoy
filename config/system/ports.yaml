# 统一端口配置
version: "1.0.0"

ports:
  # 核心服务
  gateway: 5002
  auth: 5444
  
  # Agent 服务
  agent_api: 5010
  multi_agent: 5005
  file_service: 5008
  web_dashboard: 5011
  
  # 基础设施
  redis: 6379
  ollama: 11434
  
  # 安全端口
  https: 5443
  secure_dashboard: 5446
  driver_service: 5013
  llm_service: 5012

# 环境变量覆盖
env_overrides:
  GATEWAY_PORT: gateway
  AUTH_PORT: auth
  REDIS_PORT: redis
  OLLAMA_PORT: ollama
