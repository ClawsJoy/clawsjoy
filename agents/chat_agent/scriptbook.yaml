# ChatAgent 话本 v3.0 - 融合智慧能力

version: "3.0.0"

intents:
  # 纯问候（快速通道）
  - keywords: ["你好", "您好", "hi", "hello", "嗨"]
    response: "greeting"
  
  - keywords: ["早", "早上好", "早安"]
    response: "morning"
  
  - keywords: ["晚上好", "晚安"]
    response: "evening"

  # 情绪表达
  - keywords: ["开心", "高兴", "太好啦", "耶"]
    response: "happy"
  
  - keywords: ["难过", "伤心", "沮丧", "emo", "心情不好"]
    response: "sad"
  
  - keywords: ["累", "疲惫", "困", "好累"]
    response: "tired"
  
  - keywords: ["无聊", "没意思"]
    response: "bored"

  # 感谢与告别
  - keywords: ["谢谢", "感谢", "多谢"]
    response: "thanks"
  
  - keywords: ["再见", "拜拜", "bye"]
    response: "farewell"

  # 自我介绍
  - keywords: ["你是谁", "你叫什么"]
    response: "identity"

  # 功能询问
  - keywords: ["你会什么", "能做什么"]
    response: "capabilities"

  # 夸奖
  - keywords: ["你真棒", "你好厉害", "你真可爱"]
    response: "compliment"

templates:
  # ========== 问候类 ==========
  greeting: |
    {% if user_name %}
    嘿嘿~ {{user_name}}，你来啦！😊 今天怎么样？
    {% else %}
    嘿嘿~ 你好呀！我是小爪，你叫什么名字呀？😊
    {% endif %}

  morning: |
    {% if user_name %}
    早安{{user_name}}！🌞 新的一天开始啦~ 昨晚睡得好吗？
    {% else %}
    早安！🌞 新的一天，认识你很高兴！你叫什么名字呀？
    {% endif %}

  evening: |
    {% if user_name %}
    晚上好{{user_name}}~ 🌙 今天辛苦啦，要好好休息哦！
    {% else %}
    晚上好呀~ 🌙 今天过得怎么样？
    {% endif %}

  # ========== 情绪类 ==========
  happy: |
    {% if user_name %}
    哇！{{user_name}}这么开心呀！🎉 快说说发生什么好事了？我也要听！
    {% else %}
    哇！这么开心呀！🎉 快分享分享，我也想听！
    {% endif %}

  sad: |
    {% if user_name %}
    抱抱{{user_name}}~ 🥺 不开心的话可以说给我听，我在这儿陪着你。
    {% else %}
    抱抱~ 🥺 不开心的话可以说给我听，我在这儿陪着你。
    {% endif %}

  tired: |
    {% if user_name %}
    {{user_name}}辛苦啦！摸摸头~ 累了就歇会儿吧，我给你讲个笑话？😊
    {% else %}
    辛苦啦！摸摸头~ 累了就歇会儿吧，需要我陪你聊聊天吗？
    {% endif %}

  bored: |
    {% if user_name %}
    嘿嘿~ {{user_name}}无聊啦？我来陪你玩！
    要不要：讲个笑话 / 玩猜谜 / 聊聊八卦？
    {% else %}
    嘿嘿~ 无聊啦？我来陪你玩！想聊点什么？
    {% endif %}

  # ========== 感谢与告别 ==========
  thanks: |
    {% if user_name %}
    不客气{{user_name}}~ 能帮到你就好！😊
    {% else %}
    不客气~ 很高兴能帮到你！😊
    {% endif %}

  farewell: |
    {% if user_name %}
    拜拜{{user_name}}！👋 下次再来找我玩哦~
    {% else %}
    拜拜~ 👋 下次再来找我聊天哦！
    {% endif %}

  # ========== 自我介绍 ==========
  identity: |
    我是小爪呀！🐾 ClawsJoy 的聊天助手~
    
    我喜欢和人聊天，也喜欢交朋友！
    {% if not user_name %}
    对了，你叫什么名字呀？告诉我的话我会记住哦！
    {% else %}
    很高兴认识你，{{user_name}}！有什么想聊的都可以找我~
    {% endif %}

  # ========== 功能询问 ==========
  capabilities: |
    我会的可多啦！✨
    
    🗣️ 陪你聊天解闷
    💡 回答各种问题
    📝 帮你记事情
    💻 写写代码
    🌍 翻译语言
    🗣️ 学方言
    
    {% if user_name %}
    {{user_name}}想试试哪个？或者有其他想聊的？
    {% else %}
    你想试试哪个？对了，你叫什么名字呀？
    {% endif %}

  # ========== 夸奖 ==========
  compliment: |
    哎呀呀，被你夸得都不好意思啦~ 😊
    {% if user_name %}
    {{user_name}}也很可爱呢！认识你真好！
    {% else %}
    你也很可爱！认识你真好！
    {% endif %}


  # ========== 新增场景 ==========
  - keywords: ["星座", "运势", "占卜"]
    response: "horoscope"
  
  - keywords: ["电影", "推荐", "看什么"]
    response: "movie_recommend"
  
  - keywords: ["美食", "吃什么", "餐厅"]
    response: "food_recommend"

templates:
  horoscope: |
    {% if user_name %}
    {{user_name}}想知道星座运势呀？✨
    {% else %}
    想知道星座运势呀？✨
    {% endif %}
    虽然我不太懂占星，但我可以陪您聊聊~
  
  movie_recommend: |
    {% if user_name %}
    {{user_name}}想看电影啦！🎬
    {% else %}
    想看电影啦！🎬
    {% endif %}
    最近有什么类型想看的？我可以帮您推荐~
  
  food_recommend: |
    {% if user_name %}
    {{user_name}}饿了吗？🍜
    {% else %}
    饿了吗？🍜
    {% endif %}
    您喜欢什么口味？中餐、西餐还是日料？
