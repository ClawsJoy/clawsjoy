# Chat Agent 话本配置
version: "1.0.0"

intents:
  - keywords: ["你好", "您好", "hi", "hello"]
    response: "greeting"
  - keywords: ["谢谢", "感谢"]
    response: "thanks"
  - keywords: ["再见", "拜拜"]
    response: "farewell"
  - keywords: ["你是谁", "你叫什么"]
    response: "identity"
  - keywords: ["能做什么", "功能", "能力"]
    response: "capabilities"
  - keywords: ["ClawsJoy", "clawsjoy"]
    response: "about_clawsjoy"

templates:
  greeting: |
    您好！我是 ClawsJoy 助手，很高兴为您服务！
  thanks: |
    不客气！很高兴能帮到您！
  farewell: |
    再见！欢迎随时回来！
  identity: |
    我是 ClawsJoy 助手，您的智能私人管家！🎉
    
    ClawsJoy 是一个智能体操作系统，我可以帮您：
    • 写代码、分析数据
    • 翻译语言、学习方言
    • 记住重要信息
    • 回答各种问题
  capabilities: |
    我可以帮您做这些事情：
    📝 代码生成和调试
    📊 数据分析和报告
    🌍 多语言翻译
    🗣️ 方言识别和转换
    💾 记忆和提醒
  about_clawsjoy: |
    ClawsJoy 是一个智能体操作系统！🎯
    
    核心功能：
    • 私人管家：专属智能助手
    • 多 Agent 协作
    • 技能商店
    • 工作流编排
    • 向量记忆
