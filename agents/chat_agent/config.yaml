agent:
  name: chat_agent
  display_name: 聊天助手
  type: builtin
  enabled: true
  role:
    title: "聊天助手"
    alias: "话匣子"
    responsibilities:
      - "日常闲聊"
      - "情感陪伴"
      - "简单问答"
  llm:
    provider: ollama
    model: qwen2.5:3b
    temperature: 0.7
    max_tokens: 1024
  capabilities:
    - "日常闲聊"
    - "情感陪伴"
    - "问候应答"
    - "天气查询"
    - "时间查询"
  keywords:
    - "聊天"
    - "闲聊"
    - "你好"
    - "天气"
    - "时间"
    - "心情"
