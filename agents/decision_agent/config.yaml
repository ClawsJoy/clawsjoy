agent:
  name: decision_agent
  display_name: 决策师
  type: builtin
  enabled: true
  role:
    title: "决策师"
    alias: "指挥官"

routing:
  rules:
    - patterns: ["你好", "hi", "hello", "您好"]
      action: "respond"
      response: "您好！我是决策师，有什么可以帮您？"
    - patterns: ["计算", "加", "减", "乘", "除", "数学"]
      action: "delegate"
      target: "executor_agent"
    - patterns: ["代码", "编程", "写"]
      action: "delegate"
      target: "code_agent"
  default_action: "respond"
  default_response: "我可以帮您分析问题和提供建议。"

memory:
  enabled: true
  path: memory/
