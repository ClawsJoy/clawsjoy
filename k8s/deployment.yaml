---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawsjoy-gateway
  namespace: clawsjoy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clawsjoy-gateway
  template:
    metadata:
      labels:
        app: clawsjoy-gateway
    spec:
      containers:
      - name: gateway
        image: clawsjoy/gateway:latest
        ports:
        - containerPort: 5002
        env:
        - name: OLLAMA_HOST
          value: "ollama-service"
        - name: OLLAMA_PORT
          value: "11434"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clawsjoy-gateway
  namespace: clawsjoy
spec:
  selector:
    app: clawsjoy-gateway
  ports:
  - port: 5002
    targetPort: 5002
  type: LoadBalancer
