<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>工作流编辑器</title>
<style>*{margin:0;padding:0;box-sizing:border-box;} body{font-family:monospace;background:#1a1a2e;color:#e0e0ff;}.title-bar{-webkit-app-region:drag;height:32px;background:#0f0f1a;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #00f3ff33;}.title-bar-buttons{-webkit-app-region:no-drag;margin-left:auto;}.title-bar-buttons button{background:none;border:none;color:#e0e0ff;cursor:pointer;padding:0 10px;}.container{display:flex;height:calc(100vh-32px);}.node-panel{width:260px;background:#0f0f1a;border-right:1px solid #00f3ff33;padding:15px;}.node-panel h3{color:#00f3ff;}.node-item{background:#1a1a2e;border:1px solid #00f3ff33;border-radius:6px;padding:8px;margin:5px 0;cursor:grab;}.canvas{flex:1;background:#0a0a1a;background-image:linear-gradient(rgba(0,243,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,0.05) 1px,transparent 1px);background-size:20px 20px;overflow:auto;}#flowCanvas{width:2000px;height:2000px;position:relative;}.workflow-node{position:absolute;min-width:160px;background:#1a1a2e;border:2px solid #00f3ff;border-radius:8px;cursor:move;}.node-header{background:#00f3ff22;padding:8px;font-weight:bold;}.property-panel{width:280px;background:#0f0f1a;border-left:1px solid #00f3ff33;padding:15px;}button{background:linear-gradient(135deg,#00f3ff,#b000ff);border:none;color:white;padding:6px12px;border-radius:5px;cursor:pointer;}.toolbar{position:fixed;bottom:20px;left:280px;background:#0f0f1a;padding:8px16px;border-radius:30px;border:1px solid #00f3ff;}</style>
</head>
<body>
<div class="title-bar"><span>🎨 工作流编辑器</span><div class="title-bar-buttons"><button onclick="window.close()">✕</button></div></div>
<div class="container">
<div class="node-panel"><h3>🔧 节点库</h3>
<div class="node-item" draggable="true" data-agent="video_agent">🎥 视频制作</div>
<div class="node-item" draggable="true" data-agent="code_agent">💻 代码生成</div>
<div class="node-item" draggable="true" data-agent="analysis_agent">📊 数据分析</div>
<div class="node-item" draggable="true" data-skill="manju_maker">🎬 馒头视频</div>
<div class="node-item" draggable="true" data-skill="add_subtitles">📝 添加字幕</div>
</div>
<div class="canvas" id="canvas"><div id="flowCanvas"></div></div>
<div class="property-panel"><h3>📋 属性</h3><div id="propertyContent">点击节点编辑</div></div>
</div>
<div class="toolbar"><button onclick="save()">💾 保存</button><button onclick="execute()">🚀 执行</button><button onclick="clearCanvas()">🗑️ 清空</button></div>
<script>
let nodes=[],selected=null;
document.querySelectorAll('.node-item').forEach(i=>i.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',JSON.stringify({label:i.innerText.trim(),agent:i.dataset.agent,skill:i.dataset.skill}))));
const canvas=document.getElementById('canvas'),flowCanvas=document.getElementById('flowCanvas');
canvas.addEventListener('dragover',e=>e.preventDefault());
canvas.addEventListener('drop',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();const data=JSON.parse(e.dataTransfer.getData('text/plain'));nodes.push({id:Date.now(),label:data.label,x:e.clientX-rect.left+canvas.scrollLeft-80,y:e.clientY-rect.top+canvas.scrollTop-40,config:{agent:data.agent,skill:data.skill}});render();});
function render(){flowCanvas.innerHTML='';nodes.forEach(n=>{const d=document.createElement('div');d.className='workflow-node'+(selected===n.id?' selected':'');d.style.left=n.x+'px';d.style.top=n.y+'px';d.innerHTML=`<div class="node-header">${n.label}</div>`;d.onclick=()=>selected=n.id;flowCanvas.appendChild(d);});}
function save(){const name=prompt('工作流名称');if(name)localStorage.setItem(`wf_${name}`,JSON.stringify(nodes));}
async function execute(){const steps=nodes.map((n,i)=>({step:i+1,agent:n.config.agent||'skill',action:n.label}));const res=await fetch('http://localhost:5002/api/workflow/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow:'custom',input:{steps}})});const result=await res.json();alert('工作流已启动: '+result.workflow_id);}
function clearCanvas(){if(confirm('清空？')){nodes=[];render();}}
render();
</script>
</body>
</html>
