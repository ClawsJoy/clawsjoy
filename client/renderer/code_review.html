<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>代码审核</title>
<style>*{margin:0;padding:0;box-sizing:border-box;} body{font-family:monospace;background:#1a1a2e;color:#e0e0ff;}.title-bar{-webkit-app-region:drag;height:32px;background:#0f0f1a;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #00f3ff33;}.title-bar-buttons{-webkit-app-region:no-drag;margin-left:auto;}.title-bar-buttons button{background:none;border:none;color:#e0e0ff;cursor:pointer;padding:0 10px;}.container{display:flex;height:calc(100vh-32px);}.code-panel{flex:1;display:flex;flex-direction:column;padding:15px;}.code-editor{flex:1;background:#0a0a1a;border:1px solid #00f3ff33;border-radius:8px;padding:15px;font-family:monospace;font-size:13px;resize:none;color:#e0e0ff;}.review-panel{width:380px;background:#0f0f1a;border-left:1px solid #00f3ff33;padding:15px;overflow-y:auto;}.suggestion{background:#1a1a2e;border-left:3px solid #00f3ff;padding:10px;margin:10px 0;border-radius:4px;}button{background:linear-gradient(135deg,#00f3ff,#b000ff);border:none;color:white;padding:8px16px;border-radius:6px;cursor:pointer;margin:10px5px;}.status{padding:10px;background:#0a0a1a;border-radius:8px;margin-bottom:15px;}h3{color:#00f3ff;}</style>
</head>
<body>
<div class="title-bar"><span>🔍 代码审核</span><div class="title-bar-buttons"><button onclick="window.close()">✕</button></div></div>
<div class="container">
<div class="code-panel"><div><button onclick="analyze()">🔍 分析代码</button></div><textarea id="code" class="code-editor" placeholder="粘贴代码..."></textarea></div>
<div class="review-panel"><h3>📋 审核结果</h3><div id="results"><div class="status">💡 点击"分析代码"开始</div></div></div>
</div>
<script>
async function analyze(){const code=document.getElementById('code').value;if(!code){alert('请粘贴代码');return;}document.getElementById('results').innerHTML='<div class="status">⏳ 分析中...</div>';try{const res=await fetch('http://localhost:5002/api/code/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const data=await res.json();document.getElementById('results').innerHTML='<div class="status">📊 分析完成</div>'+(data.issues?data.issues.map(i=>`<div class="suggestion"><strong>${i.type}</strong><br>${i.message}</div>`).join(''):'<div class="status">✅ 未发现问题</div>');}catch(e){document.getElementById('results').innerHTML='<div class="status">❌ 连接失败</div>';}}
</script>
</body>
</html>
