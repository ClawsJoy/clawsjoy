<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ClawsJoy WebSocket 测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .status-bar {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: gray;
        }
        .status-dot.connected { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-dot.disconnected { background: #ff4444; }
        .user-info {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }
        input {
            flex: 1;
            background: #1a1a2e;
            color: #eee;
            border: 1px solid #0f3460;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #00b4e0;
            transform: scale(1.02);
        }
        .message-area {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
        }
        .message {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 8px;
            background: #1a1a2e;
        }
        .message.in { border-left: 3px solid #00d4ff; }
        .message.out { border-left: 3px solid #00ff88; text-align: right; }
        .message.system { border-left: 3px solid #ffaa00; color: #ffaa00; }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.3s;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0f3460;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #00d4ff;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
        }
        .card h3 { margin-bottom: 10px; color: #00d4ff; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔌 ClawsJoy WebSocket 测试</h1>
    
    <div class="status-bar">
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">未连接</span>
        </div>
        <button onclick="connectWebSocket()">连接</button>
        <button onclick="disconnectWebSocket()">断开</button>
    </div>
    
    <div class="user-info">
        <label>用户ID:</label>
        <input type="text" id="userId" value="test_user" style="width: 200px; margin-left: 10px;">
        <button onclick="joinRoom()">加入房间</button>
    </div>
    
    <div class="row">
        <div class="card">
            <h3>💬 发送消息</h3>
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入消息...">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
        <div class="card">
            <h3>📊 任务进度模拟</h3>
            <button onclick="simulateTask()">模拟长任务</button>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="progressText">0%</span>
        </div>
    </div>
    
    <div class="message-area" id="messageArea">
        <div class="message system">等待 WebSocket 连接...</div>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let userId = 'test_user';
    
    function addMessage(type, content) {
        const area = document.getElementById('messageArea');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${content}`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }
    
    function connectWebSocket() {
        socket = io('http://localhost:5003', {
            transports: ['websocket'],
            reconnection: true
        });
        
        socket.on('connect', () => {
            document.getElementById('statusDot').className = 'status-dot connected';
            document.getElementById('statusText').innerText = '已连接';
            addMessage('system', '✅ WebSocket 连接成功');
        });
        
        socket.on('disconnect', () => {
            document.getElementById('statusDot').className = 'status-dot disconnected';
            document.getElementById('statusText').innerText = '未连接';
            addMessage('system', '❌ WebSocket 断开');
        });
        
        socket.on('connected', (data) => {
            addMessage('system', `连接确认: ${data.sid}`);
        });
        
        socket.on('joined', (data) => {
            addMessage('system', `已加入房间: ${data.room}`);
        });
        
        socket.on('chat_response', (data) => {
            addMessage('in', `收到回复: ${data.message}`);
        });
        
        socket.on('stream_chunk', (data) => {
            addMessage('in', `流式: ${data.chunk}`);
        });
        
        socket.on('task_progress', (data) => {
            const percent = data.progress;
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${percent}% - ${data.message || ''}`;
            addMessage('system', `任务 ${data.task_id}: ${percent}%`);
        });
        
        socket.on('notification', (data) => {
            addMessage('system', `🔔 ${data.title}: ${data.body}`);
        });
    }
    
    function disconnectWebSocket() {
        if (socket) {
            socket.disconnect();
            socket = null;
        }
    }
    
    function joinRoom() {
        userId = document.getElementById('userId').value;
        if (socket) {
            socket.emit('join', { user_id: userId });
        }
    }
    
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value;
        if (socket && message) {
            socket.emit('chat_message', { user_id: userId, message: message });
            addMessage('out', `发送: ${message}`);
            input.value = '';
        }
    }
    
    function simulateTask() {
        addMessage('system', '开始模拟任务...');
        let progress = 0;
        const interval = setInterval(() => {
            progress += 10;
            if (socket) {
                socket.emit('task_progress', { 
                    user_id: userId, 
                    task_id: 'test_' + Date.now(),
                    progress: progress,
                    message: `处理中 ${progress}%`
                });
            }
            if (progress >= 100) {
                clearInterval(interval);
                addMessage('system', '任务完成！');
            }
        }, 500);
    }
    
    // 自动连接
    setTimeout(connectWebSocket, 1000);
</script>
</body>
</html>
