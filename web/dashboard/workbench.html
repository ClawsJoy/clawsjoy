<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawsJoy · AI劳动力管理</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --text: #c9d1d9; --sub: #8b949e; --blue: #58a6ff;
  --green: #3fb950; --red: #f85149; --purple: #bc8cff;
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,sans-serif; height:100vh; display:flex; }
.sidebar { width:260px; min-width:180px; max-width:500px; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:relative; }
.sidebar-resize { position:absolute; right:-4px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:10; }
.sidebar-resize:hover { background:var(--blue); opacity:0.4; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
.sidebar-header .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
.nav { display:flex; flex-direction:column; padding:8px; }
.nav-btn { background:none; border:none; color:var(--sub); padding:10px 12px; text-align:left; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:8px; }
.nav-btn:hover,.nav-btn.active { background:rgba(88,166,255,0.08); color:var(--text); }
.nav-btn .icon { font-size:16px; }
.members { padding:8px; border-top:1px solid var(--border); margin-top:auto; }
.members-title { font-size:11px; color:var(--sub); padding:8px; text-transform:uppercase; letter-spacing:1px; }
.member-row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:12px; position:relative; }
.member-row:hover { background:rgba(255,255,255,0.03); }
.member-row .avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.member-row .info { flex:1; min-width:0; }
.member-row .name { font-weight:500; }
.member-row .pos { font-size:10px; color:var(--sub); }
.member-row .status { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.member-row .status.active { background:var(--green); }
.member-row .status.paused { background:#d2991d; }
.member-row .actions { display:none; gap:4px; }
.member-row:hover .actions { display:flex; }
.member-row .actions button { background:none; border:none; color:var(--sub); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
.member-row .actions button:hover { color:var(--text); background:rgba(255,255,255,0.05); }
.main { flex:1; display:flex; flex-direction:column; }
.tab-content { display:none; flex:1; flex-direction:column; }
.tab-content.active { display:flex; }
.chat-header { padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
.chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.msg.user { align-self:flex-end; background:var(--blue); color:#fff; }
.msg.agent { align-self:flex-start; background:var(--card); border:1px solid var(--border); }
.msg .tag { font-size:11px; color:var(--purple); margin-bottom:4px; font-weight:600; }
.chat-input { padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px; position:relative; }
.chat-input input { flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:20px; font-size:13px; outline:none; }
.chat-input button { background:var(--blue); color:#fff; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; flex-shrink:0; }
.market { padding:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; align-content:start; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:border-color .2s; }
.card:hover { border-color:var(--blue); }
.card .pos-icon { font-size:32px; margin-bottom:8px; }
.card .pos-name { font-weight:600; font-size:14px; }
.card .pos-desc { font-size:12px; color:var(--sub); margin:6px 0; }
.card .pos-budget { font-size:12px; color:var(--green); }
.card .hire-btn { margin-top:10px; width:100%; background:var(--blue); color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; }
.timeline { padding:20px; overflow-y:auto; }
.tl-item { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
.tl-icon { font-size:20px; flex-shrink:0; margin-top:2px; }
.tl-body { flex:1; }
.tl-agent { font-weight:600; font-size:13px; }
.tl-action { font-size:13px; margin:4px 0; }
.tl-meta { font-size:11px; color:var(--sub); }
.tl-status { font-size:11px; padding:2px 8px; border-radius:10px; display:inline-block; }
.tl-status.completed { background:rgba(63,185,80,0.15); color:var(--green); }
.tl-status.failed { background:rgba(248,81,73,0.15); color:var(--red); }
.billing { padding:20px; overflow-y:auto; }
.billing .total { font-size:36px; font-weight:700; margin-bottom:20px; }
.billing .total span { font-size:14px; color:var(--sub); font-weight:400; }
.bill-row { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; display:flex; align-items:center; gap:12px; }
.bill-row .bar-wrap { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.bill-row .bar { height:100%; border-radius:4px; transition:width .5s; }
.bill-row .bar.normal { background:var(--green); }
.bill-row .bar.warn { background:#d2991d; }
.bill-row .bar.danger { background:var(--red); }
.bill-info { font-size:12px; color:var(--sub); min-width:120px; text-align:right; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; justify-content:center; align-items:center; }
.modal.show { display:flex; }
.modal-content { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; width:360px; }
.modal-content h3 { margin-bottom:16px; }
.modal-content label { display:block; font-size:12px; color:var(--sub); margin:8px 0 4px; }
.modal-content input,.modal-content select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:6px; font-size:13px; margin-bottom:8px; }
.modal-content button { width:100%; background:var(--blue); color:#fff; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:600; margin-top:8px; }
.modal-content .btn-cancel { background:var(--border); margin-top:4px; }
.at-list { position:absolute; bottom:60px; left:16px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:4px; z-index:50; max-height:200px; overflow-y:auto; min-width:180px; }
.at-list div { padding:6px 12px; cursor:pointer; border-radius:4px; font-size:13px; }
.at-list div:hover { background:rgba(88,166,255,0.1); }
.empty-hint { text-align:center; color:var(--sub); padding:40px; font-size:13px; }
.plan-btn { transition:all 0.2s; }
</style>
</head>
<body>

<div class="sidebar" id="sidebarPanel"><div class="sidebar-resize" id="sidebarResize"></div>
  <div class="sidebar-header"><span class="dot"></span> ClawsJoy v8</div>
  <div class="nav">
    <button class="nav-btn active" data-tab="chat"><span class="icon">💬</span> 团队频道</button>
    <button class="nav-btn" data-tab="market"><span class="icon">🏪</span> 岗位市场</button>
    <button class="nav-btn" data-tab="timeline"><span class="icon">📋</span> 时间线</button>
    <button class="nav-btn" data-tab="billing"><span class="icon">💰</span> 账单</button>
    <button class="nav-btn" data-tab="agent" onclick="openAgent()"><span class="icon">🤖</span> Agent 工作区</button>
    <a href="http://localhost:8502" target="_blank" class="nav-btn" style="text-decoration:none;color:var(--blue);"><span class="icon">🎯</span> AI Studio →</a>
    <a href="http://localhost:7860" target="_blank" class="nav-btn" style="text-decoration:none;color:var(--purple);"><span class="icon">🎭</span> 数字人 →</a>
    <a href="/v5.1" target="_blank" class="nav-btn" style="text-decoration:none;color:var(--green);"><span class="icon">🐾</span> v5.1 门户 →</a>
  </div>
  <div class="members-title">团队成员</div>
  <div class="members" id="memberList"><div class="empty-hint">暂无AI员工<br>去岗位市场招聘吧</div></div>
</div>

<div class="main">
  <div id="tab-chat" class="tab-content active">
    <div class="chat-header">💬 团队频道</div>
    <div class="chat-messages" id="chatMessages"><div class="empty-hint">👋 欢迎使用 ClawsJoy v8<br>输入消息开始工作</div></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="发消息或指令..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">发送</button>
    </div>
  </div>
  <div id="tab-market" class="tab-content">
    <div class="chat-header">🏪 岗位市场 · 聘用AI员工</div>
    <div class="market" id="marketList"></div>
  </div>
  <div id="tab-timeline" class="tab-content">
    <div class="chat-header">📋 时间线</div>
    <div class="timeline" id="timelineContent"></div>
  </div>
  <div id="tab-billing" class="tab-content">
    <div class="chat-header">💰 账单（仅供参考）</div>
    <div class="billing" id="billingContent"></div>
  </div>
</div>

<div class="modal" id="hireModal">
  <div class="modal-content">
    <h3 id="hireTitle">聘用 AI 员工</h3>
    <label>员工名字</label><input id="hireName" placeholder="如：小程">
    <label>模型</label>
    <select id="hireModel">
      <option value="">本地 Ollama（默认）</option>
      <option value="deepseek-v3">DeepSeek V3（需 Key）</option>
      <option value="glm-5.2">GLM 5.2（智谱 · 国内直连）</option>
      <option value="claude-code">Claude Code CLI（需安装）</option>
      <option value="claude-4">Claude 4 API（需 Key）</option>
    </select>
    <label>API Key <span style="color:var(--sub);font-weight:400">（本地模型可留空）</span></label>
    <input id="hireApiKey" placeholder="sk-...">
    <label>单价 <span style="color:var(--sub);font-weight:400">$/1K tokens</span></label>
    <input id="hireUnitPrice" type="number" step="0.0001" value="0" placeholder="0=仅记账不估算">
    <label>月预算 ($)</label>
    <input id="hireBudget" type="number" step="0.01" value="0" placeholder="0=不限">
    <button onclick="doHire()">聘用</button>
    <button class="btn-cancel" onclick="closeModal()">取消</button>
  </div>
</div>

<!-- Agent 弹窗 -->
<div id="agentModal" style="display:none; position:fixed; top:0; left:0; right:0; height:100vh; background:rgba(0,0,0,0.85); z-index:9999; flex-direction:column;">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#161b22; border-bottom:1px solid #30363d;">
    <span style="color:#c9d1d9; font-size:16px; font-weight:600;">🤖 Agent 工作区</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <select id="threadSelect" onchange="switchThread(this.value)" style="background:#0d1117; border:1px solid #30363d; color:#c9d1d9; border-radius:4px; padding:3px 6px; font-size:11px;"></select>
      <span id="balanceDisplay" style="color:#8b949e; font-size:11px;">💰 --</span>
      <button onclick="newThread()" style="background:#30363d; color:#c9d1d9; border:none; border-radius:4px; padding:3px 8px; font-size:11px; cursor:pointer;">+新建</button>
    </div>
    <button onclick="closeAgent()" style="background:none; border:none; color:#8b949e; font-size:20px; cursor:pointer;">✕</button>
  </div>
  <div style="flex:1; display:flex; gap:0; overflow:hidden; min-height:0;">
    <div id="filePanel" style="width:220px; min-width:50px; max-width:50vw; background:#0d1117; border-right:1px solid #30363d; padding:12px; overflow-y:auto; position:relative;flex-shrink:0;">
      <div id="fileDragHandle" style="position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:10;"></div>
      <div style="color:#58a6ff; font-size:12px; margin-bottom:8px; font-weight:600;">📁 文件系统</div>
      <div id="fileTree" style="font-family:monospace; font-size:12px; color:#c9d1d9; line-height:1.8;"></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; background:#0d1117;">
      <div id="agentTerminal" style="flex:1; min-height:0; padding:16px; overflow-y:auto; overflow-x:hidden; word-break:break-all; font-family:'JetBrains Mono',monospace; font-size:13px; color:#c9d1d9; white-space:pre-wrap; line-height:1.6;">
        <div style="color:#58a6ff;">🤖 ClawsJoy Agent 就绪。输入任务开始。</div>
      </div>
      <div style="display:flex; gap:6px; padding:12px 16px; background:#161b22; border-top:1px solid #30363d; align-items:center; position:sticky; bottom:0;">
        <input id="agentInput" placeholder="描述任务..." style="flex:1; width:0; min-width:150px; background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:10px 14px; color:#c9d1d9; font-size:14px; outline:none;" onkeydown="if(event.key==='Enter') agentSend()">
        <button onclick="agentSend()" style="background:#238636; color:#fff; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; flex-shrink:0;">▶ 执行</button>
        <button onclick="agentSendAsync()" style="background:#1f6feb; color:#fff; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; white-space:nowrap; flex-shrink:0;" title="后台执行">🔗</button>
        <button onclick="agentStop()" id="agentStopBtn" style="background:#30363d; color:#c9d1d9; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; display:none; white-space:nowrap; flex-shrink:0;">⏹</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 全局状态 ==========
const API = '';
let userId = localStorage.getItem('clawsjoy_user_id');
if (!userId) { userId = 'web_' + Date.now(); localStorage.setItem('clawsjoy_user_id', userId); }

let sessionId = localStorage.getItem('clawsjoy_session_id');
if (!sessionId || sessionId === 'default') { sessionId = 'session_' + Date.now(); localStorage.setItem('clawsjoy_session_id', sessionId); }

let currentThread = localStorage.getItem('current_thread');
if (!currentThread || currentThread === 'default') { currentThread = sessionId; localStorage.setItem('current_thread', currentThread); }

let threads = [...new Set(JSON.parse(localStorage.getItem('agent_threads') || '[]').filter(t => t && t !== 'default'))];
if (!threads.includes(currentThread)) { threads.push(currentThread); }

let agentRunning = false, agentAbort = false;
let currentPosition = '', atList = null, selectedPlanBtn = null;

function saveThreads() {
  localStorage.setItem('agent_threads', JSON.stringify(threads.filter(t => t && t !== 'default')));
  localStorage.setItem('current_thread', currentThread);
}

// ========== 侧边栏拖拽 ==========
(function(){
  const sb = document.getElementById('sidebarPanel');
  const h = document.getElementById('sidebarResize');
  if (!sb || !h) return;
  let sx, sw;
  h.addEventListener('mousedown', e => {
    sx = e.clientX; sw = sb.offsetWidth;
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', mu);
    e.preventDefault();
  });
  function mv(e) { const w = sw + e.clientX - sx; if (w >= 180 && w <= 500) sb.style.width = w + 'px'; }
  function mu() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', mu); }
})();

// ========== 文件树拖拽 ==========
let fileDragInit = false;
function initFileDrag() {
  if (fileDragInit) return;
  const h = document.getElementById('fileDragHandle'), p = document.getElementById('filePanel');
  if (!h || !p) return;
  fileDragInit = true;
  let sx, sw;
  h.addEventListener('mousedown', e => {
    sx = e.clientX; sw = p.offsetWidth;
    e.preventDefault(); e.stopPropagation();
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', mu);
  });
  function mv(e) { const w = sw + e.clientX - sx; if (w >= 50 && w <= window.innerWidth * 0.5) p.style.width = w + 'px'; }
  function mu() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', mu); }
}

// ========== 导航 ==========
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function() { if (this.dataset.tab !== 'agent') switchTab(this.dataset.tab); });
});
function switchTab(tab) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'market') loadMarket();
  if (tab === 'billing') loadBilling();
  if (tab === 'timeline') loadTimeline();
}

// ========== 聊天 ==========
async function send() {
  const input = document.getElementById('chatInput'), msg = input.value.trim();
  if (!msg) return;
  addMessage('user', msg); input.value = ''; hideAtList();
  addMessage('agent', '📋 正在规划任务...', '包工头');
  try {
    const r = await fetch(API + '/v5/execute', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw_input: msg, user_id: userId, session_id: 'web_' + userId, server_id: 'default' })
    });
    const d = await r.json();
    const reply = d.response || d.output_content || '';
    if (reply) {
      const msgs = document.getElementById('chatMessages').children;
      if (msgs.length > 0) msgs[msgs.length - 1].remove();
      addMessage('agent', reply, '包工头');
    }
    loadMembers(); loadTasks();
  } catch (e) { addMessage('agent', '出错了: ' + e.message); }
}

async function loadTasks() {
  try {
    const r = await fetch(API + '/v8/task/list?server_id=default&created_by=' + userId);
    const tasks = await r.json();
    const container = document.getElementById('chatMessages');
    container.querySelectorAll('.task-card').forEach(el => el.remove());
    const card = document.createElement('div');
    card.className = 'msg agent task-card';
    let html = '<b>📋 任务看板</b><br>';
    const emoji = { 'pending': '⏳', 'running': '🔄', 'done': '✅', 'reviewed': '✔️', 'failed': '❌' };
    for (const t of tasks.slice(-4)) {
      html += `${emoji[t.status] || '❓'} ${t.title || '无标题'} → @${t.assigned_to || '待分配'}<br>`;
    }
    const lastTask = localStorage.getItem('last_task_id');
    if (lastTask) {
      try {
        const tr = await fetch(API + '/v9/task/' + lastTask + '?user_id=' + userId + '&session_id=' + sessionId);
        const td = await tr.json();
        if (td.success && td.status !== 'not_found') {
          html += '<br><b>🤖 Agent 工作区</b><br>';
          html += `${td.status === 'done' ? '✅' : '🔄'} 最近任务: ${td.status || '未知'}<br>`;
        }
      } catch (e) { }
    }
    card.innerHTML = html; container.appendChild(card);
  } catch (e) { }
  setTimeout(loadTasks, 5000);
}

function addMessage(type, text, tag) {
  const container = document.getElementById('chatMessages');
  const hint = container.querySelector('.empty-hint');
  if (hint) hint.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = '🤖 ' + tag; div.appendChild(t); }
  div.appendChild(document.createTextNode(text));
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ========== @ 成员 ==========
document.getElementById('chatInput').addEventListener('input', function () {
  const val = this.value, lastAt = val.lastIndexOf('@');
  if (lastAt >= 0 && (lastAt === 0 || val[lastAt - 1] === ' ')) showAtList(); else hideAtList();
});
function showAtList() {
  if (atList) return;
  atList = document.createElement('div'); atList.className = 'at-list';
  fetch(API + '/v8/roster/list?server_id=default').then(r => r.json()).then(members => {
    atList.innerHTML = members.length
      ? members.map(m => `<div onmousedown="event.preventDefault()" onclick="insertAt('${m.name}')">${m.position === '程序员' ? '👨‍💻' : m.position === '设计师' ? '👩‍🎨' : '📊'} ${m.name} · ${m.position}</div>`).join('')
      : '<div style="color:var(--sub)">暂无成员</div>';
  });
  document.querySelector('.chat-input').appendChild(atList);
}
function hideAtList() { if (atList) { atList.remove(); atList = null; } }
function insertAt(name) {
  const input = document.getElementById('chatInput'), val = input.value, lastAt = val.lastIndexOf('@');
  input.value = val.substring(0, lastAt) + '@' + name + ' ';
  hideAtList(); input.focus();
}

// ========== 成员 ==========
async function loadMembers() {
  try {
    const r = await fetch(API + '/v8/roster/list?server_id=default');
    const members = await r.json();
    const el = document.getElementById('memberList');
    if (!members.length) { el.innerHTML = '<div class="empty-hint">暂无AI员工<br>去岗位市场招聘吧</div>'; return; }
    el.innerHTML = members.map(m => `
      <div class="member-row">
        <div class="avatar">${m.position === '程序员' ? '👨‍💻' : m.position === '设计师' ? '👩‍🎨' : '📊'}</div>

// ========== Agent 工作区 ==========
function agentLog(text, color = '#c9d1d9') {
  const term = document.getElementById('agentTerminal');
  if (!term) return;
  const line = document.createElement('div');
  line.style.color = color;
  line.textContent = text;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
  let logs = JSON.parse(localStorage.getItem('agent_logs_' + currentThread) || '[]');
  logs.push({ text, color, time: Date.now() });
  if (logs.length > 200) logs = logs.slice(-200);
  localStorage.setItem('agent_logs_' + currentThread, JSON.stringify(logs));
}

async function executeToolCall(name, args, rawArgs) {
  const base = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
  const body = { user_id: userId, session_id: sessionId, ...args };
  // write_file 长内容走独立字段，不经过 JSON 序列化
  if (name === 'write_file' && rawArgs) {
    try {
      let contentMatch = rawArgs.match(/"content":\s*"([^"]*?)"(,\s*"|}$)/);
      if (contentMatch) {
        body.content = contentMatch[1];  // 原始 content，不经过 JSON 转义
      }
    } catch(e) {}
  }
  const endpoints = {
    read_file: '/v9/sandbox/read', write_file: '/v9/sandbox/write',
    list_dir: '/v9/sandbox/list', search_files: '/v9/sandbox/search',
    execute_command: '/v9/sandbox/exec', edit_file: '/v9/sandbox/edit',
    query_index: '/v9/sandbox/query_index', write_large: '/v9/sandbox/write_large'
  };
  // write_file 长内容自动路由到 write_large
  if (name === 'write_file' && body.raw_arguments && body.raw_arguments.length > 3000) {
    return await fetch(API + '/v9/sandbox/write_large', { ...base, body: JSON.stringify({ user_id: userId, session_id: sessionId, path: body.path, raw_arguments: body.raw_arguments }) }).then(r => r.json());
  }
  if (!endpoints[name]) return { success: false, error: '未知工具: ' + name };
  return await fetch(API + endpoints[name], { ...base, body: JSON.stringify(body) }).then(r => r.json());
}

async function agentSend() {
  const input = document.getElementById('agentInput');
  const task = input.value.trim();
  if (!task || agentRunning) return;
  if (task.toUpperCase() === '/CLEAN') {
    localStorage.removeItem('agent_logs_' + currentThread);
    document.getElementById('agentTerminal').innerHTML = '<div style="color:#58a6ff;">🤖 ClawsJoy Agent 就绪。输入任务开始。</div>';
    input.value = ''; return;
  }
  input.value = '';
  agentRunning = true; agentAbort = false;
  document.getElementById('agentStopBtn').style.display = 'inline-block';
  agentLog('👤 ' + task, '#58a6ff');

  const messages = [
    { role: 'system', content: '你是 ClawsJoy 的 AI 助手。根据用户任务自动判断角色。每次开始工作时，第一句话声明角色，格式：🔄 以XX身份工作。你可以操作文件系统——读取、写入、搜索文件。遇到任务先分析，再动手。每次只做一件事，做完看结果再决定下一步。' },
    { role: 'user', content: task }
  ];

  let maxLoops = 25;
  while (!agentAbort && maxLoops > 0) {
    // 读文件操作不消耗循环轮次
    const lastMsg = messages[messages.length - 1];
    const isReadOnly = lastMsg && lastMsg.tool_calls && lastMsg.tool_calls.every(t => ['read_file','list_dir','search_files'].includes(t.function.name));
    if (!isReadOnly) maxLoops--;
    try {
      const resp = await fetch(API + '/v9/agent/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, session_id: sessionId, model: 'deepseek-v4-flash', messages })
      });
      const d = await resp.json();
      if (!d.success) { agentLog('❌ API 错误: ' + d.error, '#f85149'); break; }

      localStorage.setItem('last_task_id', Date.now().toString(36));

      if (d.status === 'initializing') {
        agentLog('🔧 ' + d.message, '#d2991d');
        setTimeout(() => agentSend(), 3000);
        return;
      }

      const msg = d.data.choices[0].message;
      if (msg.content) {
        if (msg.content.includes('📋 方案')) {
          agentLog(renderPlanButtons(msg.content), '#c9d1d9');
        } else {
          agentLog('🤖 ' + msg.content, '#c9d1d9');
        }
      }

      if (!msg.tool_calls || msg.tool_calls.length === 0) {
        agentLog('✅ 任务完成', '#3fb950'); break;
      }

      messages.push({ role: 'assistant', content: msg.content || '', tool_calls: msg.tool_calls });
      if (msg.reasoning_content) messages[messages.length - 1].reasoning_content = msg.reasoning_content;

      for (const tool of msg.tool_calls) {
        let args;
        const raw = tool.function.arguments;
        // JSON.parse 优先，失败后正则 fallback
        try {
          args = JSON.parse(raw);
          args.raw_arguments = raw;
        } catch(e) {
          const pathMatch = raw.match(/"path"\s*:\s*"([^"]+)"/);
          const lineMatch = raw.match(/"line"\s*:\s*(\d+)/);
          const contentMatch = raw.match(/"content"\s*:\s*"([\s\S]*?)(?:"\s*}\s*$|"\s*,\s*"line|"\s*,\s*"path)/);
          const cmdMatch = raw.match(/"command"\s*:\s*"([\s\S]*?)(?:"\s*}\s*$)/);
          args = {
            path: pathMatch ? pathMatch[1] : '',
            line: lineMatch ? parseInt(lineMatch[1]) : 0,
            content: contentMatch ? contentMatch[1] : '',
            command: cmdMatch ? cmdMatch[1] : '',
            raw_arguments: raw
          };
        }
        if (tool.function.name === 'write_file') {
          if (!args.path) { agentLog('⚠️ write_file path 为空，跳过', '#d2991d'); continue; }
        } else if (tool.function.name === 'execute_command') {
          if (!args.command || args.command.trim() === '') {
            if (raw.length > 3000) { args = { raw_arguments: raw }; }
            else { agentLog('⚠️ execute_command command 为空，跳过', '#d2991d'); continue; }
          }
        } else {  
          try {
            args = JSON.parse(tool.function.arguments);
          } catch(e) {
            let fixed = tool.function.arguments;
            // 尝试多种修复策略
            let strategies = [
            // 策略1：补闭合引号 + 转义控制字符
            () => {
              let s = fixed;
              if (s.split('"').length % 2 === 0) { s += '"'; }
              s = s.replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
              return s;
            },
            // 策略2：找到 content 字段的闭合位置，截断后面的非法字符
            () => {
              let s = fixed;
              let contentIdx = s.indexOf('"content":');
              if (contentIdx > 0) {
                let afterContent = s.substring(contentIdx + 11);
                let endQuote = afterContent.indexOf('",');
                if (endQuote > 0) {
                  let contentEnd = contentIdx + 11 + endQuote;
                  s = s.substring(0, contentEnd + 2) + '}';
                }
              }
              return s;
            },
            // 策略3：提取 content 字段，手动构造新的 arguments
            () => {
              let pathMatch = fixed.match(/"path":\s*"([^"]+)"/);
              let contentStart = fixed.indexOf('"content":');
              if (pathMatch && contentStart > 0) {
                let contentValue = fixed.substring(contentStart + 12, fixed.lastIndexOf('"'));
                let args = { path: pathMatch[1], content: contentValue };
                let lineMatch = fixed.match(/"line":\s*(\d+)/);
                if (lineMatch) { args.line = parseInt(lineMatch[1]); }
                return JSON.stringify(args);
              }
              return fixed;
            }
          ];
          let parsed = false;
          for (let strategy of strategies) {
            try {
              args = JSON.parse(strategy());
              parsed = true;
              break;
            } catch(e2) {}
          }
          if (!parsed) { agentLog('❌ 工具参数 JSON 解析失败，跳过此步骤', '#f85149'); continue; }
          }
        }
        agentLog('🔧 ' + tool.function.name + '(' + JSON.stringify(args) + ')', '#d2991d');
        let result, retries = 3;
        while (retries > 0) {
          result = await executeToolCall(tool.function.name, args, tool.function.arguments);
          if (result.success || (result.error && result.error.startsWith('未知工具'))) break;
          retries--;
          if (retries > 0) agentLog('🔄 重试中... (' + retries + '次剩余)', '#d2991d');
        }
        let toolResult = JSON.stringify(result);
        // 安全截断：先解析，截断 content 字段，再序列化
        try {
          let tr = JSON.parse(toolResult);
          if (tr.content && typeof tr.content === 'string' && tr.content.length > 2000) {
            tr.content = tr.content.substring(0, 2000) + '\n... (内容已截断，共 ' + tr.content.length + ' 字符)';
            toolResult = JSON.stringify(tr);
          }
        } catch(e) {}
        agentLog('📤 ' + toolResult.substring(0, 500), '#8b949e');
        if (tool.function.name === 'edit_file' && !result.success && result.error && result.error.includes('FIM match failed')) {
          toolResult = JSON.stringify({ error: "edit_file failed. Please use write_file with the full file content.", hint: "write_file(path, full_content)" });
        }
        messages.push({ role: 'tool', tool_call_id: tool.id, content: toolResult });
        if (tool.function.name === 'write_file' || tool.function.name === 'write_large') {
          try {
            let tr = JSON.parse(toolResult);
            if (tr.auto_fixed === false) {
	      messages.push({ role: "system", content: `[系统] write_file 写入失败，网关自动修复也失败。你必须用 python3 heredoc 方式重新写入，不要再调 write_file 或 execute_command。

python3 << PYEOF
content = """..."""
with open("目标文件", "w") as f:
    f.write(content)
PYEOF` });
            }
          } catch(e) {}
        }            
      }
      refreshFileTree();
    } catch (e) { agentLog('❌ 错误: ' + e.message, '#f85149'); break; }
  }
  if (maxLoops === 0) {
    agentLog('⚠️ 达到最大循环次数，当前进度：', '#d2991d');
    let ps = getProgressSummary(messages);
    if (ps.filesRead.length) agentLog('  📄 已读: ' + ps.filesRead.join(', '), '#8b949e');
    if (ps.filesModified.length) agentLog('  ✏️ 已修改: ' + ps.filesModified.join(', '), '#8b949e');
    agentLog('  📊 已执行: ' + messages.length + '轮', '#8b949e');
    localStorage.setItem('agent_pause_' + currentThread, JSON.stringify({ task: task, messages: messages }));
    const div = document.createElement('div');
    div.style.cssText = 'margin-top:10px;display:flex;gap:8px;';
    div.innerHTML = '<button id="btnContinue" style="background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;">▶ 继续任务(25轮)</button><button id="btnCancel" style="background:#30363d;color:#c9d1d9;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;">✕ 放弃</button>';
    document.getElementById('agentTerminal').appendChild(div);
    document.getElementById('btnContinue').onclick = function() {
      const saved = JSON.parse(localStorage.getItem('agent_pause_' + currentThread));
      if (saved && saved.messages) { 
  div.remove(); 
  agentLog('▶ 继续执行...', '#d2991d'); 
  agentRunning = true; 
  document.getElementById('agentStopBtn').style.display = 'inline-block';
  // 追加中断提示
  saved.messages.push({
    role: 'system', 
    content: '【任务中断恢复】之前的任务因达到循环上限被暂停。已完成: ' + (saved.progress || '未知') + '。请从断点继续，不要重复已完成步骤。如果目标代码已处于期望状态，直接验证并汇报。'
  });
  continuePausedTask(saved.messages); 
      } 
    };
    document.getElementById('btnCancel').onclick = function() {
      localStorage.removeItem('agent_pause_' + currentThread); div.remove(); agentLog('✕ 任务已放弃', '#8b949e'); agentRunning = false; document.getElementById('agentStopBtn').style.display = 'none';
    };
    return;
  }
  if (agentAbort) agentLog('⏹ 已停止', '#8b949e');
  agentRunning = false;
  document.getElementById('agentStopBtn').style.display = 'none';
}

// ========== 方案按钮 ==========
function renderPlanButtons(text) {
  if (typeof text !== 'string') return text;
  const plans = text.match(/📋\s*方案([A-Z])[：:][^\n]*/g);
  if (!plans) return text;
  let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  plans.forEach(plan => {
    const letter = plan.match(/方案([A-Z])/)[1];
    const btn = `<span class="plan-btn" style="display:inline-block;background:#1f6feb;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;margin:4px;font-weight:600;" onmouseover="if(!this.dataset.sel)this.style.background='#388bfd'" onmouseout="if(!this.dataset.sel)this.style.background='#1f6feb'" onclick="selectPlan(this)" data-letter="${letter}">${plan.replace(/</g,'&lt;')} → 选择此方案</span>`;
    html = html.replace(plan.replace(/</g,'&lt;'), btn);
  });
  return html;
}

function selectPlan(btn) {
  document.querySelectorAll('.plan-btn').forEach(b => { b.style.background = '#1f6feb'; b.dataset.sel = ''; });
  btn.style.background = '#238636'; btn.dataset.sel = '1'; selectedPlanBtn = btn;
  document.getElementById('agentInput').value = '选择方案' + btn.dataset.letter + '，按此方案执行';
  agentLog('📋 已选择方案' + btn.dataset.letter + '，点击执行按钮开始', '#3fb950');
}

async function agentSendAsync() {
  const input = document.getElementById('agentInput'), task = input.value.trim();
  if (!task) return;
  const taskId = 'async_' + Date.now().toString(36);
  agentLog('🔗 后台任务 ' + taskId.substring(0, 12) + ' 已启动', '#1f6feb');
  input.value = '';
  try {
    const resp = await fetch(API + '/v9/agent/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ async: true, task_id: taskId, user_id: userId, session_id: sessionId, model: 'deepseek-v4-flash', messages: [{ role: 'system', content: '你是 ClawsJoy 的 AI 助手。' }, { role: 'user', content: task }] })
    });
    const d = await resp.json();
    if (d.success) { agentLog('⏳ 后台执行中，可关闭页面，稍后查看结果', '#d2991d'); pollTaskResult(taskId); }
    else agentLog('❌ 启动失败: ' + (d.error || '未知'), '#f85149');
  } catch (e) { agentLog('❌ 网络错误', '#f85149'); }
}

async function pollTaskResult(taskId, retryCount = 0) {
  if (retryCount > 20) { agentLog('⏰ 后台任务超时，请检查任务状态', '#f85149'); return; }
  try {
    const resp = await fetch(API + '/v9/task/' + taskId + '?user_id=' + userId + '&session_id=' + sessionId);
    const d = await resp.json();
    if (d.success) {
      if (d.status === 'done') { agentLog('✅ 后台任务完成', '#3fb950'); if (d.content) agentLog('🤖 ' + d.content, '#c9d1d9'); return; }
      if (d.status === 'failed') { agentLog('❌ 后台任务失败: ' + (d.content || '未知错误'), '#f85149'); return; }
    }
    setTimeout(() => pollTaskResult(taskId, retryCount + 1), 3000);
  } catch (e) { setTimeout(() => pollTaskResult(taskId, retryCount + 1), 5000); }
}

function getProgressSummary(messages) {
  let filesRead = [...new Set(messages.filter(m => m.tool_calls).flatMap(m => m.tool_calls.filter(tc => tc.function.name === 'read_file').map(tc => JSON.parse(tc.function.arguments).path)))];
  let filesModified = [...new Set(messages.filter(m => m.tool_calls).flatMap(m => m.tool_calls.filter(tc => tc.function.name === 'write_file').map(tc => JSON.parse(tc.function.arguments).path)))];
  let summary = [];
  if (filesRead.length) summary.push('已读文件: ' + filesRead.join(', '));
  if (filesModified.length) summary.push('已修改: ' + filesModified.join(', '));
  summary.push('总轮次: ' + messages.length);
  return { filesRead, filesModified, text: summary.join('; ') };
}

function agentStop() { agentAbort = true; }

async function continuePausedTask(messages) {
  let maxLoops = 25;
  while (!agentAbort && maxLoops > 0) {
    maxLoops--;
    try {
      const resp = await fetch(API + '/v9/agent/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, session_id: sessionId, model: 'deepseek-v4-flash', messages })
      });
      const d = await resp.json();
      if (!d.success) { agentLog('❌ API 错误: ' + d.error, '#f85149'); break; }
      const msg = d.data.choices[0].message;
      if (msg.content) agentLog('🤖 ' + msg.content, '#c9d1d9');
      if (!msg.tool_calls || msg.tool_calls.length === 0) { agentLog('✅ 任务完成', '#3fb950'); break; }
      messages.push({ role: 'assistant', content: msg.content || '', tool_calls: msg.tool_calls });
      for (const tool of msg.tool_calls) {
        let args;
        const raw = tool.function.arguments;
        // JSON.parse 优先，失败后正则 fallback
        try {
          args = JSON.parse(raw);
          args.raw_arguments = raw;
        } catch(e) {
          const pathMatch = raw.match(/"path"\s*:\s*"([^"]+)"/);
          const lineMatch = raw.match(/"line"\s*:\s*(\d+)/);
          const contentMatch = raw.match(/"content"\s*:\s*"([\s\S]*?)(?:"\s*}\s*$|"\s*,\s*"line|"\s*,\s*"path)/);
          const cmdMatch = raw.match(/"command"\s*:\s*"([\s\S]*?)(?:"\s*}\s*$)/);
          args = {
            path: pathMatch ? pathMatch[1] : '',
            line: lineMatch ? parseInt(lineMatch[1]) : 0,
            content: contentMatch ? contentMatch[1] : '',
            command: cmdMatch ? cmdMatch[1] : '',
            raw_arguments: raw
          };
        }
        if (tool.function.name === 'write_file') {
          if (!args.path) { agentLog('⚠️ write_file path 为空，跳过', '#d2991d'); continue; }
        } else if (tool.function.name === 'execute_command') {
          if (!args.command || args.command.trim() === '') {
            if (raw.length > 3000) { args = { raw_arguments: raw }; }
            else { agentLog('⚠️ execute_command command 为空，跳过', '#d2991d'); continue; }
          }
        } else {
          try {
            args = JSON.parse(tool.function.arguments);
          } catch(e) {
            let fixed = tool.function.arguments;
            // 尝试多种修复策略
          let strategies = [
            // 策略1：补闭合引号 + 转义控制字符
            () => {
              let s = fixed;
              if (s.split('"').length % 2 === 0) { s += '"'; }
              s = s.replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
              return s;
            },
            // 策略2：找到 content 字段的闭合位置，截断后面的非法字符
            () => {
              let s = fixed;
              let contentIdx = s.indexOf('"content":');
              if (contentIdx > 0) {
                let afterContent = s.substring(contentIdx + 11);
                let endQuote = afterContent.indexOf('",');
                if (endQuote > 0) {
                  let contentEnd = contentIdx + 11 + endQuote;
                  s = s.substring(0, contentEnd + 2) + '}';
                }
              }
              return s;
            },
            // 策略3：提取 content 字段，手动构造新的 arguments
            () => {
              let pathMatch = fixed.match(/"path":\s*"([^"]+)"/);
              let contentStart = fixed.indexOf('"content":');
              if (pathMatch && contentStart > 0) {
                let contentValue = fixed.substring(contentStart + 12, fixed.lastIndexOf('"'));
                let args = { path: pathMatch[1], content: contentValue };
                let lineMatch = fixed.match(/"line":\s*(\d+)/);
                if (lineMatch) { args.line = parseInt(lineMatch[1]); }
                return JSON.stringify(args);
              }
              return fixed;
            }
          ];
          let parsed = false;
          for (let strategy of strategies) {
            try {
              args = JSON.parse(strategy());
              parsed = true;
              break;
            } catch(e2) {}
          }
          if (!parsed) { agentLog('❌ 工具参数 JSON 解析失败，跳过此步骤', '#f85149'); continue; }
          }
        }
        agentLog('🔧 ' + tool.function.name + '(' + JSON.stringify(args) + ')', '#d2991d');
        const result = await executeToolCall(tool.function.name, args, tool.function.arguments);
        agentLog('📤 ' + JSON.stringify(result).substring(0, 300), '#8b949e');
        const maxLen = tool.function.name === 'read_file' ? 2000 : 500;
        messages.push({ role: 'tool', tool_call_id: tool.id, content: JSON.stringify(result).substring(0, maxLen) });
      }
      if (maxLoops === 0) {
    agentLog('⚠️ 达到最大循环次数，当前进度：', '#d2991d');
    let filesRead = [...new Set(messages.filter(m => m.tool_calls).flatMap(m => m.tool_calls.filter(tc => tc.function.name === 'read_file').map(tc => JSON.parse(tc.function.arguments).path)))];
    if (filesRead.length) agentLog('  📄 已读: ' + filesRead.join(', '), '#8b949e');
    agentLog('  📊 已执行: ' + messages.length + '轮', '#8b949e');
    // 生成进度清单
let ps = getProgressSummary(messages);
const progressData = {
  original_task: (messages.find(m => m.role === 'user') || {}).content || '未知任务',
  completed_steps: [
    ...ps.filesRead.map(f => ({action: 'read_file', file: f})),
    ...ps.filesModified.map(f => ({action: 'write_file', file: f}))
  ],
  pending_steps: ['验证测试'],
  total_rounds: messages.length
};
localStorage.setItem('agent_pause_' + currentThread, JSON.stringify({ messages: messages, progress: ps.text }));

// 持久化到 .agent_state.json
fetch(API + '/v9/task/save_progress', {
  method: 'POST', headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({ user_id: userId, session_id: sessionId, progress: progressData })
}).catch(() => {});
    const div = document.createElement('div');
    div.style.cssText = 'margin-top:10px;display:flex;gap:8px;';
    div.innerHTML = '<button id="btnContinue2" style="background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;">▶ 继续任务(25轮)</button><button id="btnCancel2" style="background:#30363d;color:#c9d1d9;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;">✕ 放弃</button>';
    document.getElementById('agentTerminal').appendChild(div);
    document.getElementById('btnContinue2').onclick = function() {
      const saved = JSON.parse(localStorage.getItem('agent_pause_' + currentThread));
      if (saved && saved.messages) { div.remove(); agentLog('▶ 继续执行...', '#d2991d'); agentRunning = true; document.getElementById('agentStopBtn').style.display = 'inline-block'; continuePausedTask(saved.messages); }
    };
    document.getElementById('btnCancel2').onclick = function() {
      localStorage.removeItem('agent_pause_' + currentThread); div.remove(); agentLog('✕ 任务已放弃', '#8b949e'); agentRunning = false; document.getElementById('agentStopBtn').style.display = 'none';
    };
    return;
  }
    } catch (e) { agentLog('❌ 错误: ' + e.message, '#f85149'); break; }
  }
  agentRunning = false;
  document.getElementById('agentStopBtn').style.display = 'none';
}

// ========== 文件树 ==========
async function refreshFileTree() {
  try {
    const resp = await fetch(API + '/v9/sandbox/list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, session_id: sessionId, path: '.' }) });
    const d = await resp.json();
    if (d.success) {
      let html = '';
      for (const dir of (d.dirs || [])) html += `<div data-path="${dir}" onclick="openDir('${dir}')" style="cursor:pointer;">📁 ${dir}</div>`;
      for (const file of (d.files || [])) html += `<div onclick="openFile('${file}')" style="cursor:pointer;">📄 ${file}</div>`;
      document.getElementById('fileTree').innerHTML = html;
    }
  } catch (e) { }
}

async function openDir(path) {
  const resp = await fetch(API + '/v9/sandbox/list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, session_id: sessionId, path }) });
  const d = await resp.json();
  if (!d.success) return;
  const tree = document.getElementById('fileTree'), folderDiv = tree.querySelector(`[data-path="${path}"]`);
  if (!folderDiv) return;
  if (folderDiv.classList.contains('expanded')) {
    folderDiv.classList.remove('expanded');
    const sub = folderDiv.nextElementSibling; if (sub && sub.classList.contains('sub-tree')) sub.remove();
    return;
  }
  folderDiv.classList.add('expanded');
  const subDiv = document.createElement('div'); subDiv.style.paddingLeft = '16px'; subDiv.className = 'sub-tree';
  for (const dir of (d.dirs || [])) subDiv.innerHTML += `<div data-path="${path + '/' + dir}" onclick="event.stopPropagation();openDir('${path + '/' + dir}')" style="cursor:pointer;">📁 ${dir}</div>`;
  for (const file of (d.files || [])) subDiv.innerHTML += `<div onclick="event.stopPropagation();openFile('${path + '/' + file}')" style="cursor:pointer;">📄 ${file}</div>`;
  folderDiv.after(subDiv);
}

async function openFile(path) {
  const resp = await fetch(API + '/v9/sandbox/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, session_id: sessionId, path }) });
  const d = await resp.json();
  if (d.success) { agentLog('📄 ' + path, '#58a6ff'); agentLog(d.content, '#c9d1d9'); }
}

async function refreshBalance() {
  try {
    const r = await fetch(API + '/v9/balance');
    const d = await r.json();
    if (d.success) {
      const ds = (d.deepseek && d.deepseek.total) ? d.deepseek.total : '--';
      const glm = (d.glm && d.glm.total) ? d.glm.total : '--';
      const cost = d.total_cost || '--';
      document.getElementById('balanceDisplay').innerHTML = `🔵 ¥${ds}  🟣 ¥${glm}  💰 ¥${cost}`;
    }
  } catch (e) { }
}

// ========== 线程管理 ==========
function loadThreads() {
  const sel = document.getElementById('threadSelect');
  if (!sel) return;
  sel.innerHTML = threads.map(t => `<option value="${t}" ${t === currentThread ? 'selected' : ''}>${t.substring(0, 20)}</option>`).join('');
}
function switchThread(id) {
  currentThread = id; sessionId = id; localStorage.setItem('clawsjoy_session_id', id); saveThreads();
  const term = document.getElementById('agentTerminal');
  const logs = JSON.parse(localStorage.getItem('agent_logs_' + currentThread) || '[]');
  term.innerHTML = '';
  if (logs.length > 0) {
    logs.forEach(l => {
      const line = document.createElement('div');
      line.style.color = l.color;
      line.textContent = l.text;
      if (l.text && l.text.includes('📋 方案')) { line.innerHTML = renderPlanButtons(l.text); line.style.whiteSpace = 'normal'; }
      term.appendChild(line);
    });
  } else { term.innerHTML = '<div style="color:#58a6ff;">🤖 切换到线程 ' + id.substring(0, 16) + '</div>'; }
  term.scrollTop = term.scrollHeight;
  refreshFileTree();
}
function newThread() {
  const id = 'session_' + Date.now();
  threads.push(id); currentThread = id; sessionId = id; localStorage.setItem('clawsjoy_session_id', id); saveThreads(); loadThreads();
  document.getElementById('agentTerminal').innerHTML = '<div style="color:#58a6ff;">🤖 新线程 ' + id.substring(0, 16) + ' 就绪</div>';
  refreshFileTree();
}

// ========== Agent 面板 ==========
function openAgent() {
  setTimeout(initFileDrag, 100);
  document.getElementById('agentModal').style.display = 'flex';
  localStorage.setItem('agent_open', '1');
  loadThreads(); refreshFileTree(); refreshBalance();
  const term = document.getElementById('agentTerminal');
  const logs = JSON.parse(localStorage.getItem('agent_logs_' + currentThread) || '[]');
  if (logs.length > 0) {
    term.innerHTML = '';
    logs.forEach(l => {
      const line = document.createElement('div');
      line.style.color = l.color;
      line.textContent = l.text;
      if (l.text && l.text.includes('📋 方案')) { line.innerHTML = renderPlanButtons(l.text); line.style.whiteSpace = 'normal'; }
      term.appendChild(line);
    });
    term.scrollTop = term.scrollHeight;
  }
}
function closeAgent() {
  document.getElementById('agentModal').style.display = 'none';
  localStorage.setItem('agent_open', '0');
}

loadMembers();
if (localStorage.getItem('agent_open') === '1') setTimeout(openAgent, 500);
