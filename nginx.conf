events {
    worker_connections 1024;
}

http {
    upstream clawsjoy_backend {
        least_conn;
        server gateway:5002 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name clawsjoy.local;

        location / {
            proxy_pass http://clawsjoy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://clawsjoy_backend/health;
            access_log off;
        }

        location /metrics {
            proxy_pass http://clawsjoy_backend/metrics;
            access_log off;
        }
    }
}
