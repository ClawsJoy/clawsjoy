# CODE Agent 配置 v1.0
# 驱动配置 - 统一管理代码生成行为

version: "1.0.0"

# Agent 基础配置
agent:
  name: "CODE Agent"
  version: "2.0.0"
  type: "professional"
  description: "Continue风格智能编程助手"

# 代码模板配置
templates:
  threejs_cockpit:
    name: "环抱座舱"
    description: "Three.js 3D环抱座舱"
    file: "templates/threejs/cockpit.html"
    parameters:
      dome_color: "#00f3ff"
      dome_opacity: 0.15
      curvature: 5
      wall_angle: 15

  html_base:
    name: "基础HTML"
    description: "基础HTML页面模板"
    file: "templates/html/base.html"

# 学习配置
learning:
  enabled: true
  memory_file: "data/code_agent_memory.json"
  max_history: 100
  auto_save: true

# 用户偏好配置
preferences:
  colors:
    default: "#00f3ff"
    alternatives:
      purple: "#9b59b6"
      blue: "#3498db"
      pink: "#e84393"
  styles:
    default: "balanced"
    options: ["concise", "detailed", "balanced"]

# 输出配置
output:
  temp_dir: "/tmp"
  default_format: "html"
  auto_preview: true

# 路由配置
routes:
  generate:
    path: "/api/code/generate"
    method: "POST"
    handler: "code_generate"
  modify:
    path: "/api/code/modify"
    method: "POST"
    handler: "code_modify"
  accept:
    path: "/api/code/accept"
    method: "POST"
    handler: "code_accept"
  feedback:
    path: "/api/code/feedback"
    method: "POST"
    handler: "code_feedback"
