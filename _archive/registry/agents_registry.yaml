# Agent 注册表 - 配置驱动
# 一级配置，定义所有 Agent 的元信息

version: "1.0.0"

agents:
  # 核心 Agent
  chat_agent:
    name: "聊天助手"
    type: "core"
    enabled: true
    module: "core.agents.chat_agent"
    class: "ChatAgent"
    description: "通用对话助手"
    capabilities: ["chat", "qa"]
    priority: 10
  
  code_agent:
    name: "代码助手"
    type: "core"
    enabled: true
    module: "core.agents.code_agent"
    class: "CodeAgent"
    description: "代码生成、审查、调试"
    capabilities: ["code_generation", "code_review", "debug"]
    priority: 10
  
  hermes_agent:
    name: "Hermes智能体"
    type: "core"
    enabled: true
    module: "core.agents.hermes_agent"
    class: "HermesAgent"
    description: "任务分解、工具调用、自我反思"
    capabilities: ["task_decomposition", "tool_use", "self_reflection"]
    priority: 9
  
  decision_agent:
    name: "决策助手"
    type: "core"
    enabled: true
    module: "core.agents.decision_agent"
    class: "DecisionAgent"
    description: "决策分析、建议"
    capabilities: ["decision_making", "analysis"]
    priority: 8
  
  orchestrator:
    name: "任务编排器"
    type: "core"
    enabled: true
    module: "core.agents.orchestrator"
    class: "OrchestratorAgent"
    description: "任务规划、编排"
    capabilities: ["task_planning", "orchestration"]
    priority: 8
  
  analysis_agent:
    name: "数据分析师"
    type: "core"
    enabled: true
    module: "core.agents.analysis_agent"
    class: "AnalysisAgent"
    description: "数据分析、报告"
    capabilities: ["data_analysis", "reporting"]
    priority: 7
  
  # 专业 Agent
  ai_agent:
    name: "AI智能体"
    type: "custom"
    enabled: true
    module: "skills.ai.ai_agent"
    class: "AIAgentSkill"
    description: "AI任务处理"
    capabilities: ["ml", "dl", "llm"]
    priority: 8
  
  docker_executor:
    name: "Docker容器"
    type: "custom"
    enabled: true
    module: "skills.docker.docker_executor"
    class: "DockerSkill"
    description: "容器管理"
    capabilities: ["docker", "container"]
    priority: 8
  
  vision:
    name: "图像识别"
    type: "skill"
    enabled: true
    module: "skills.image.vision"
    class: "VisionSkill"
    description: "图像识别、分析"
    capabilities: ["image", "vision"]
    priority: 9

# Agent 分组
groups:
  core:
    - chat_agent
    - code_agent
    - hermes_agent
    - decision_agent
    - orchestrator
  professional:
    - ai_agent
    - docker_executor
    - vision
  skill:
    - translate
    - calculate
    - get_weather
