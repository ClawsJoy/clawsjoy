# Agent 配置 - 统一注册中心
agents:
  # ========== 核心 Agent ==========
  chat_agent:
    name: "聊天助手"
    type: "core"
    enabled: true
    module: "core.agents.builtin.chat_agent"
    class: "ChatAgent"
    capabilities: ["chat", "qa", "conversation"]

  code_agent:
    name: "代码助手"
    type: "core"
    enabled: true
    module: "core.agents.builtin.code_agent"
    class: "CodeAgent"
    capabilities: ["code_generation", "code_review", "debug", "refactor"]

  hermes_agent:
    name: "Hermes智能体"
    type: "core"
    enabled: true
    module: "core.agents.builtin.hermes_agent"
    class: "HermesAgent"
    capabilities: ["task_decomposition", "tool_use", "self_reflection", "skill_creation"]

  orchestrator:
    name: "任务编排器"
    type: "core"
    enabled: true
    module: "core.agents.builtin.orchestrator"
    class: "OrchestratorAgent"
    capabilities: ["task_planning", "orchestration", "workflow"]

  decision_agent:
    name: "决策助手"
    type: "core"
    enabled: true
    module: "core.agents.builtin.decision_agent"
    class: "DecisionAgent"
    capabilities: ["decision_making", "analysis", "recommendation"]

  # ========== 分析 Agent ==========
  analysis_agent:
    name: "数据分析师"
    type: "core"
    enabled: true
    module: "core.agents.builtin.analysis_agent"
    class: "AnalysisAgent"
    capabilities: ["data_analysis", "reporting", "insights"]

  analyst_agent:
    name: "分析师"
    type: "core"
    enabled: true
    module: "core.agents.analyst_agent"
    class: "AnalystAgent"
    capabilities: ["business_analysis", "metrics"]

  collector_agent:
    name: "采集助手"
    type: "core"
    enabled: true
    module: "core.agents.collector_agent"
    class: "CollectorAgent"
    capabilities: ["data_collection", "crawling"]

  # ========== 记忆 Agent ==========
  memory_manager:
    name: "记忆管理助手"
    type: "core"
    enabled: true
    module: "core.agents.memory_manager"
    class: "MemoryManagerAgent"
    capabilities: ["memory_store", "memory_recall", "vector_search"]

  memory_agent:
    name: "记忆助手"
    type: "core"
    enabled: true
    module: "core.agents.builtin.memory_agent"
    class: "MemoryAgent"
    capabilities: ["short_term_memory", "long_term_memory"]

  # ========== 安全 Agent ==========
  security_agent:
    name: "安全助手"
    type: "core"
    enabled: true
    module: "core.agents.builtin.security_agent"
    class: "SecurityAgent"
    capabilities: ["security_check", "audit", "permission_verify"]

  # ========== 媒体 Agent ==========
  video_agent:
    name: "视频制作助手"
    type: "custom"
    enabled: true
    module: "core.agents.builtin.video_agent"
    class: "VideoAgent"
    capabilities: ["video_creation", "manju_maker", "editing"]

  youtube_agent:
    name: "YouTube助手"
    type: "custom"
    enabled: true
    module: "core.agents.builtin.youtube_agent"
    class: "YouTubeAgent"
    capabilities: ["video_upload", "channel_analysis", "seo"]

  # ========== 协作 Agent ==========
  collaboration_agent:
    name: "协作助手"
    type: "core"
    module: "core.agents.builtin.collaboration_agent"
    class: "CollaborationAgent"
    capabilities: ["multi_agent_collaboration", "cross_domain_learning"]

  copywriter_agent:
    name: "文案专家"
    type: "custom"
    enabled: true
    module: "core.agents.copywriter_agent"
    class: "CopywriterAgent"
    capabilities: ["copywriting", "slogan", "product_description"]

  executor_agent:
    name: "执行助手"
    type: "core"
    module: "core.agents.builtin.executor_agent"
    class: "ExecutorAgent"
    capabilities: ["task_execution", "skill_invocation"]

  frontend_agent:
    name: "前端助手"
    type: "custom"
    enabled: true
    module: "core.agents.frontend_agent"
    class: "FrontendAgent"
    capabilities: ["frontend_development", "ui_generation"]

  life_cycle_agent:
    name: "生命周期助手"
    type: "core"
    enabled: true
    module: "core.agents.life_cycle_agent"
    class: "LifeCycleAgent"
    capabilities: ["agent_lifecycle", "state_management"]

  translate_agent:
    name: "翻译助手"
    type: "custom"
    enabled: true
    module: "core.agents.builtin.translate_agent"
    class: "TranslateAgent"
    capabilities: ["translation", "language_detection"]

  # ========== 测试 Agent ==========
  test_agent_001:
    name: "测试Agent"
    type: "test"
    enabled: true
    module: "core.agents.test_agent_001"
    class: "TestAgent001Agent"
    capabilities: ["testing"]

  inheritance_test_agent:
    name: "继承测试Agent"
    type: "test"
    enabled: true
    module: "core.agents.inheritance_test_agent"
    class: "InheritanceTestAgent"
    capabilities: ["testing"]


  test_agent_001:
    name: "测试助手"
    type: "test"
    enabled: true
    module: "core.agents.builtin.test_agent_001"
    class: "TestAgent001"
    capabilities: ["testing"]


  dialect_agent:
    name: "方言翻译助手"
    type: "custom"
    enabled: true
    module: "core.agents.builtin.dialect_agent"
    class: "DialectAgent"
    capabilities: ["dialect_translation", "language_learning"]
