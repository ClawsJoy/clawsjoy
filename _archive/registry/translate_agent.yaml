# 翻译 Agent 配置 v1.0
# 驱动配置 + 学习机制

version: "1.0.0"

# Agent 基础信息
agent:
  name: "翻译助手"
  version: "1.0.0"
  description: "专门负责中英文翻译和技能匹配的智能代理"

# 学习配置
learning:
  enabled: true
  memory_file: "data/translate_memory.json"
  auto_save: true
  max_history: 500
  # 学习策略
  strategies:
    - type: "user_query"
      enabled: true
      description: "从用户查询中学习新词汇映射"
    - type: "vector_feedback"
      enabled: true
      description: "根据向量搜索结果反馈学习"
    - type: "manual_correction"
      enabled: true
      description: "接受手动修正"

# 词汇映射表（可学习更新）
vocabulary:
  # 中文 → 英文关键词映射
  cn_to_en:
    视频: ["video", "media"]
    制作: ["maker", "create", "produce"]
    漫剧: ["manju", "comic_video"]
    合成: ["compose", "merge"]
    剪辑: ["edit", "cut"]
    字幕: ["subtitle", "caption"]
    上传: ["upload"]
    转码: ["transcode", "convert"]
    图像: ["image", "picture"]
    图片: ["image", "photo"]
    生成: ["generate", "create"]
    绘画: ["draw", "paint"]
    背景: ["background"]
    抠图: ["remove_bg", "matting"]
    加法: ["add", "sum", "plus"]
    乘法: ["multiply", "times"]
    除法: ["divide", "div"]
    平方根: ["sqrt", "square_root"]
    绝对值: ["abs", "absolute"]

  # 英文技能 → 中文描述
  skill_to_cn:
    manju_maker: "漫剧视频生成器"
    complete_video_maker: "完整视频制作工具"
    video_composer: "视频合成编辑器"
    video_uploader: "视频上传工具"
    add_subtitles: "视频字幕添加工具"
    ffmpeg_video: "视频处理工具"
    image_slideshow: "图片轮播生成器"
    ai_image: "AI图像生成器"
    remove_bg: "图像去背景工具"
    add: "加法计算器"
    multiply: "乘法计算器"
    divide: "除法计算器"
    sqrt: "平方根计算器"
    abs: "绝对值计算器"

# 向量配置
vector:
  enabled: true
  collection_name: "translate_memory"
  embedding_model: "bge-m3"
  top_k: 5

# 定时任务
schedule:
  # 每日学习任务
  daily_learning:
    enabled: true
    time: "02:00"
    tasks:
      - "analyze_user_queries"
      - "update_vocabulary"
      - "optimize_mappings"

  # 每周优化
  weekly_optimize:
    enabled: true
    day: "sunday"
    time: "03:00"
    tasks:
      - "rebuild_vector_index"
      - "prune_unused_mappings"
