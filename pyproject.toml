[tool.black]
line-length = 88
target-version = ['py313']
extend-exclude = '''
/(
    skills
  | downloads
  | backups
  | tools/LightX2V
  | tools/lingji-cut
  | tools/KubeezCut
  | tools/iris.c
  | intelligence
  | core/intelligence
  | lib
  | core/lib/data_source_manager.py
  | \.git
  | __pycache__
  | \.pyc$
)/
'''

[tool.isort]
profile = "black"
skip = ["skills", "downloads", "backups", "intelligence", "tools"]

[tool.pylint]
ignore = ["skills", "downloads", "backups", "intelligence", "tools"]
