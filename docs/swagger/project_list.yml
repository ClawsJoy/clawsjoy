tags:
  - 项目管理
summary: 获取项目列表
parameters:
  - name: user_id
    in: query
    type: string
    description: 用户ID
    default: codex_user
responses:
  200:
    description: 成功
    schema:
      type: object
      properties:
        success:
          type: boolean
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              path:
                type: string
              file_count:
                type: integer
