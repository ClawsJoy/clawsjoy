tags:
  - 代码助手
summary: 自动修复代码
description: 分析代码问题并生成修复方案
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        user_id:
          type: string
          description: 用户ID
        code:
          type: string
          description: 要修复的代码
responses:
  200:
    description: 修复完成
    schema:
      type: object
      properties:
        success:
          type: boolean
        fixed_code:
          type: string
        issues:
          type: array
        message:
          type: string
