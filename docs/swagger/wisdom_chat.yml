tags:
  - 智慧对话
summary: 智慧对话接口（主入口）
description: 支持自然语言输入，自动推荐 Agent
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        user_id:
          type: string
          description: 用户ID
          default: guest
        message:
          type: string
          description: 用户消息
          required: true
        agent:
          type: string
          description: 指定 Agent（可选，不指定则自动推荐）
responses:
  200:
    description: 成功
    schema:
      type: object
      properties:
        success:
          type: boolean
        agent:
          type: string
        response:
          type: string
        meta_cognition:
          type: object
  400:
    description: 消息为空
  500:
    description: 服务器错误
