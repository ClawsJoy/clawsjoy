groups:
  - name: clawsjoy_alerts
    rules:
      - alert: GatewayDown
        expr: up{job="clawsjoy_gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ClawsJoy 网关服务停止"
          description: "网关服务已停止超过1分钟。"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 响应延迟过高"
          description: "95% 请求延迟超过 0.5 秒。"

      - alert: VectorMemoryError
        expr: vector_memory_search_errors_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "向量记忆检索失败"
          description: "最近2分钟内有向量检索错误。"
