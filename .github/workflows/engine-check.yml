name: Engine规范检查

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  check-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run engine check
        run: python3 scripts/check_engines.py

  validate-keywords:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate keywords.yaml syntax
        run: python -c "import yaml; yaml.safe_load(open('config/keywords.yaml'))"
      - name: Check agent_capabilities structure
        run: |
          python -c "
          import yaml
          with open('config/keywords.yaml') as f:
              config = yaml.safe_load(f)
          caps = config.get('agent_capabilities', {})
          print(f'✅ {len(caps)} agents configured')
          for name, cap in caps.items():
              assert 'capable_of' in cap, f'{name} missing capable_of'
              assert 'priority' in cap, f'{name} missing priority'
              assert 1 <= cap['priority'] <= 100, f'{name} priority out of range'
          print('✅ All checks passed')
          "
